<!-- Paste THIS (and only this) into a Squarespace Code Block.
     Same pattern as the GB Nowcast / council widget embeds: the iframe auto-resizes to its
     content height, and width:1px / min-width:100% forces iOS Safari to respect the column
     width instead of overflowing.

     Before this works you need to push the senedd/ folder to the custom-nowcast repo (same
     one your GeoJSON and council widget live in) so it's served from GitHub Pages. Then point
     the src below at wherever it lands, e.g.:
       https://electionmapsuk.github.io/custom-nowcast/senedd/senedd_nowcast.html

     ABOUT ?v= : GitHub Pages caches aggressively, so after you push an updated
     senedd_nowcast.html your visitors can keep seeing the old one. Bump this number (the date
     you last changed it is fine) whenever you edit the page or engine. Updating just
     build/data/central.json does NOT need a bump — that's fetched fresh at runtime. -->
<iframe
  id="seneddFrame"
  src="https://electionmapsuk.github.io/custom-nowcast/senedd/senedd_nowcast.html?v=20260916"
  title="Senedd Nowcast"
  style="width:1px; min-width:100%; height:1900px; border:0; overflow:hidden;"
  scrolling="no"
  loading="lazy"></iframe>
<script>
  window.addEventListener('message', function(e){
    if (e.data && e.data.seneddHeight && document.getElementById('seneddFrame')) {
      document.getElementById('seneddFrame').style.height = (e.data.seneddHeight + 20) + 'px';
    }
  });
</script>
