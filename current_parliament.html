  /* ---- Nowcast design tokens (electionmaps_nowcast.html) ---- */
  :root{
    --bg:#E2E4E4; --panel:#fbf7f4; --ink:#15171a; --muted:#6b7280; --faint:#9ca3af;
    --line:#e3e3df; --line2:#eeeeea; --accent:#004d4d; --accent-dk:#003a3a; --tipbg:rgb(0,38,38); --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased;}
  button,input,select{font-family:inherit;}
  html,body{overflow-x:hidden; max-width:100%;}
  html.embedded,html.embedded body{overflow:hidden;} html.embedded .wrap{padding-bottom:12px;}
  .wrap{max-width:1120px; margin:0 auto; padding:24px 20px 80px;}
  .masthead{display:flex; align-items:center; justify-content:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:14px;}
  .modepill{font-size:.7rem; font-weight:800; text-transform:uppercase; letter-spacing:.06em; padding:6px 11px; border-radius:7px; background:#eef2f2; color:var(--accent);}
  .panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:20px;}
  .panel h2{font-size:.72rem; text-transform:uppercase; letter-spacing:.09em; color:var(--faint); font-weight:700; margin:0 0 14px;}
  .section-h{font-size:.72rem; text-transform:uppercase; letter-spacing:.09em; color:var(--faint); font-weight:700; margin:28px 0 12px;}
  .grid{display:grid; grid-template-columns:minmax(0,1fr) 296px; gap:24px; align-items:stretch;}
  .grid>*{min-width:0;}
  .fullspan{grid-column:1 / -1; min-width:0;}

  /* ---- headline + seat bar + totals (Nowcast hlbox) ---- */
  .headline{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:4px;}
  .headline .big{font-size:1.5rem; font-weight:900; letter-spacing:-0.02em;}
  .headline .maj{font-size:.9rem; font-weight:600; color:var(--muted);} .headline .maj.gov{color:#16a34a;}
  .seatbar{position:relative; height:38px; border-radius:7px; overflow:hidden; display:flex; margin:16px 0 6px; background:var(--line2);}
  .seatbar .seg{height:100%; transition:width .35s cubic-bezier(.4,0,.2,1);}
  .majmark{position:absolute; top:-7px; bottom:-7px; left:50%; width:0; border-left:2px dotted #15171a; z-index:3; pointer-events:none;}
  .totstrip{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:6px; margin-top:16px;}
  .totstrip .tot .n{font-size:1.5rem;} .totstrip .tot .ch{margin-top:3px;}
  @media(max-width:600px){ .totstrip{grid-template-columns:repeat(3,minmax(0,1fr));} }
  .tot{border-radius:8px; padding:8px 12px 9px; overflow:hidden; min-width:0;}
  .tot .nm{font-size:.7rem; font-weight:800; text-transform:uppercase; letter-spacing:.02em; opacity:.92; margin-bottom:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tot .n{font-size:1.75rem; font-weight:900; line-height:1; font-variant-numeric:tabular-nums;}
  .tot .rng{font-size:.62rem; font-weight:700; opacity:.85; margin-top:3px; font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tot .ch{display:inline-block; margin-top:4px; background:rgba(0,0,0,.2); padding:1px 7px; border-radius:5px; font-size:.74rem; font-weight:800; font-variant-numeric:tabular-nums;}

  /* ---- government panel (Nowcast majority-odds panel) ---- */
  .mc{display:flex; flex-direction:column; justify-content:center; gap:14px;}
  .mc h3{font-size:.72rem; text-transform:uppercase; letter-spacing:.09em; color:var(--faint); font-weight:700; margin:0; display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
  .mc h3 .sims{font-weight:600; text-transform:none; letter-spacing:0; color:var(--faint); font-size:.7rem;}
  .mc-big{font-size:2.9rem; font-weight:900; line-height:1; letter-spacing:-0.02em;}
  .mc-sub{font-size:.95rem; color:var(--muted); margin:8px 0 0; line-height:1.5;}
  .mc-sub b{color:var(--ink);}
  #wm-chart{position:relative; margin-top:-4px;} #wm-chart svg{display:block; width:100%; height:72px; overflow:visible;}
  #wm-chart .wl{font-size:9px; font-weight:700; fill:var(--faint); font-variant-numeric:tabular-nums;}
  #wm-chart .wv{font-size:9px; font-weight:800; font-variant-numeric:tabular-nums;}
  #wm-tip{position:absolute; top:-6px; transform:translateX(-50%); font-size:.62rem; font-weight:800; white-space:nowrap; color:var(--ink); background:#fff; border:1px solid var(--line); border-radius:5px; padding:1px 6px; pointer-events:none; display:none;}
  .facts{display:flex; flex-direction:column; gap:0; border-top:1px solid var(--line2);}
  .fact{display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:5px 0; border-bottom:1px solid var(--line2); font-size:.8rem;}
  .fact .k{color:var(--muted); font-weight:600; white-space:nowrap;}
  .fact .v{font-weight:800; text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .fact .v small{display:inline; margin-left:5px; font-size:.64rem; color:var(--faint); font-weight:600; white-space:nowrap;}

  /* ---- map row (Nowcast r2grid: map | zoomed regions | right column) ---- */
  .r2grid{display:grid; grid-template-columns:minmax(0,1fr) 296px; gap:10px 24px; align-items:stretch;}
  .r2grid>*{min-width:0;}
  .topctrls{grid-column:1 / -1; display:grid; grid-template-columns:minmax(0,1fr) 296px; column-gap:24px; row-gap:10px; align-items:start;}
  .topctrls>*{margin:0; min-width:0;}
  .topctrls .section-h{grid-column:1; grid-row:1; margin:28px 0 2px;}
  .topctrls .mapmodes{grid-column:1; grid-row:2;}
  .topctrls .mapsearch{grid-column:1; grid-row:3;}
  .topctrls .mapgrp{grid-column:1; grid-row:4; display:flex; gap:8px;}
  .topctrls .evh{grid-column:2; grid-row:2; align-self:end; margin:0;}
  .topctrls .evf1{grid-column:2; grid-row:3;} .topctrls .evf2{grid-column:2; grid-row:4;}
  .evf{display:flex; gap:8px;}
  .topctrls .mapsearch input, .topctrls .mapgrp button, .topctrls .evf button{height:38px; box-sizing:border-box; margin:0;}
  .topctrls .mapgrp button, .topctrls .evf button{flex:1 1 0; min-width:0; padding:0 10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .mapmodes{display:flex; gap:6px; flex-wrap:wrap;}
  .mmb,.mtb{padding:7px 13px; border-radius:7px; border:1px solid var(--line); background:#fff; font-weight:700; font-size:.78rem; color:var(--muted); cursor:pointer;}
  .mmb:hover,.mtb:hover{border-color:var(--accent); color:var(--accent);}
  .mmb.active,.mtb.active{background:var(--accent); color:#fff; border-color:var(--accent);}
  .mtb:disabled{opacity:.5; cursor:wait;}
  .mapsearch input{width:100%; padding:0 13px; border:1px solid var(--line); border-radius:8px; font-size:.85rem; font-weight:600; color:var(--ink); background:#fff; display:block;}
  .mapsearch input::placeholder{color:var(--faint); font-weight:500;}
  .mapsearch input:focus,.tblsearch:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(0,77,77,.08);}
  #map-container{position:relative; width:100%; height:650px; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; grid-column:1; grid-row:2;}
  #map-container svg{display:block; cursor:grab;} #map-container svg:active{cursor:grabbing;}
  .insetbox{display:none; overflow:hidden; padding:0 !important; height:650px;}
  .insetbox svg{display:block; max-width:none;}
  .evbox{grid-column:2; grid-row:2; height:650px; display:flex; flex-direction:column; padding:16px 0 0 !important; overflow:hidden;}
  .mapcredit{font-size:.68rem; color:var(--faint); line-height:1.4; grid-column:1; grid-row:3; margin-top:-2px;}
  @media(min-width:1040px){
    .r2grid{grid-template-columns:calc((100% - 320px) * 2 / 3 - 8px / 3) minmax(0,1fr) 296px;}
    .r2grid .insetbox{display:block; grid-column:2; grid-row:2; margin-left:-16px;}
    .r2grid .evbox{grid-column:3;}
    body.hexmap .r2grid .insetbox{display:none;} body.hexmap .r2grid #map-container{grid-column:1 / 3;}
    .r2grid .mapcredit{grid-column:1 / 3;}
  }
  .cp{stroke:#fff; vector-effect:non-scaling-stroke; stroke-linejoin:round; stroke-linecap:round; transition:fill .18s; cursor:pointer;}
  .cp:hover{stroke:#15171a; stroke-width:1.2px;} .cp.pinned,.cp.flash{stroke:#15171a; stroke-width:1.6px;}
  .rgn{fill:none; stroke:#fff; vector-effect:non-scaling-stroke; stroke-linejoin:round; stroke-linecap:round; pointer-events:none;}
  .insbox{fill:none; stroke:#6b7280; stroke-width:1px; stroke-dasharray:3 2; vector-effect:non-scaling-stroke; pointer-events:none;}
  .inslabel{font-size:8.5px; font-weight:800; fill:var(--muted); letter-spacing:.04em; text-transform:uppercase; pointer-events:none;}
  .mapbtns{position:absolute; left:12px; bottom:12px; z-index:2; display:flex; gap:6px;}
  .mapbtns button{width:26px; height:26px; padding:0; border:1px solid var(--line); border-radius:7px; background:rgba(255,255,255,.92); color:var(--muted); font-weight:800; font-size:.72rem; cursor:pointer;}
  .mapbtns button:hover{color:var(--accent); border-color:var(--accent);}
  .maploading{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--faint); font-weight:700; font-size:.9rem;}
  .legend{position:absolute; right:12px; bottom:12px; z-index:2; display:none; gap:10px; align-items:center; background:rgba(255,255,255,.92); border:1px solid var(--line); border-radius:7px; padding:5px 9px; font-size:.66rem; font-weight:700; color:var(--muted);}
  .legend i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:4px; vertical-align:-1px;}
  body.mode-change .legend, body.mode-margin .legend{display:flex;}

  /* ---- changes log ---- */
  .evbox h2{padding:0 18px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:baseline;}
  .evbox h2 span{font-weight:600; text-transform:none; letter-spacing:0; font-size:.7rem;}
  .evlist{flex:1; overflow:auto; padding:0 10px 10px 18px;}
  .evlist::-webkit-scrollbar{width:6px;} .evlist::-webkit-scrollbar-thumb{background:#d6d3cc; border-radius:4px;}
  .evmonth{font-size:.62rem; font-weight:800; text-transform:uppercase; letter-spacing:.08em; color:var(--faint); margin:12px 0 4px; position:sticky; top:0; background:var(--panel); padding:2px 0; z-index:1;}
  .evmonth:first-child{margin-top:0;}
  .ev{display:grid; grid-template-columns:1fr auto; gap:2px 8px; padding:8px; margin:0 0 2px -8px; border-radius:7px; cursor:pointer;}
  .ev:hover{background:#f3efe9;}
  .ev .who{font-size:.8rem; font-weight:800; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .ev .seat{grid-column:1; font-size:.7rem; color:var(--muted); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .ev .txt{grid-column:1 / -1; font-size:.68rem; color:var(--faint); font-weight:600; line-height:1.35;}
  .ev .mv{grid-column:2; grid-row:1 / 3; align-self:center; display:flex; align-items:center; gap:3px;}
  .ev .mv .ar{color:var(--faint); font-size:.7rem; font-weight:800;}
  .chip{display:inline-block; padding:2px 6px; border-radius:4px; font-size:.6rem; font-weight:800; letter-spacing:.02em; min-width:30px; text-align:center;}
  .chip.vac{background:#fff; color:var(--faint); border:1px dashed #cfcac2;}
  .ev.t-by{background:#e3f0ef;} .ev.t-by:hover{background:#d4e8e6;}
  .ev .d{font-variant-numeric:tabular-nums;}

  /* ---- coalition builder (Nowcast) ---- */
  #coal-total{display:flex; align-items:center; justify-content:center; gap:7px; font-size:1.35rem; font-weight:900; letter-spacing:-0.02em; font-variant-numeric:tabular-nums; line-height:1.2; height:2rem; margin:0 0 4px; color:#dc2626; flex-wrap:nowrap; overflow:hidden; white-space:nowrap;}
  #coal-total.gov{color:#16a34a;}
  #coal-total .coalchip{display:inline-block; padding:3px 9px; border-radius:6px; font-size:.8rem; font-weight:800; letter-spacing:0; flex:none;}
  #coal-total .coaloutcome{margin-left:2px; font-size:.9rem; font-weight:600; color:var(--muted); letter-spacing:0;}
  #coal-total.gov .coaloutcome{color:#16a34a;} #coal-total.short .coaloutcome{color:#dc2626;}
  #coal-total .coalnum{display:inline-flex; align-items:baseline; gap:7px;}
  #coal-total .coalsep{color:var(--faint); font-weight:200; opacity:.45; margin:0 3px; transform:scaleX(.6); display:inline-block;}
  #coal-parties{display:flex; flex-wrap:wrap; gap:7px; justify-content:center; margin-top:16px;}
  .coalbtn{display:flex; flex-direction:column; align-items:center; gap:1px; min-width:44px; padding:5px 9px 6px; border-radius:8px; cursor:pointer; border:1.5px solid transparent; opacity:.38; filter:saturate(.85); transition:all .16s ease;}
  .coalbtn .cab{font-size:.58rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase; opacity:.92;}
  .coalbtn .cn{font-size:.92rem; font-weight:900; line-height:1; font-variant-numeric:tabular-nums;}
  .coalbtn:hover{opacity:.7;}
  .coalbtn.on{opacity:1; filter:none; box-shadow:0 2px 8px rgba(0,0,0,.16); transform:translateY(-1px);}
  #coalbar{margin:6px auto 2px;}
  #coalbar svg{display:block; width:100%; max-width:960px; height:170px; margin:0 auto;}
  .coalnote{text-align:center; font-size:.7rem; color:var(--faint); font-weight:600; margin-top:12px;}

  /* ---- table (Nowcast) ---- */
  .table-tools{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:48px 0 12px;}
  .tblsearch{flex:1; min-width:160px; max-width:300px; padding:8px 12px; border:1px solid var(--line); border-radius:8px; font-size:.82rem; font-weight:600; color:var(--ink); background:#fff;}
  .tblsearch::placeholder{color:var(--faint); font-weight:500;}
  .tblsel{padding:7px 8px; border:1px solid var(--line); border-radius:8px; background:#fff; font-weight:700; font-size:.78rem; color:var(--ink);}
  .btn{padding:9px 16px; border-radius:8px; border:1px solid var(--line); background:#fff; color:var(--ink); font-weight:700; font-size:.82rem; cursor:pointer;}
  .btn:hover{border-color:var(--accent); color:var(--accent);}
  .btn.on{background:var(--accent); color:#fff; border-color:var(--accent);}
  .table-wrap{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:auto; max-height:620px; -webkit-overflow-scrolling:touch;}
  table{width:100%; border-collapse:separate; border-spacing:0; font-size:.78rem;}
  th,td{padding:8px 10px; text-align:center; border-bottom:1px solid var(--line2); white-space:nowrap;}
  th:first-child,td:first-child{text-align:left; position:sticky; left:0; background:var(--panel); z-index:1;}
  th{position:sticky; top:0; z-index:2; background:#fbfbfa; font-size:.65rem; text-transform:uppercase; letter-spacing:.05em; color:var(--faint); font-weight:700; border-bottom:2px solid var(--line); cursor:pointer; user-select:none; -webkit-user-select:none;}
  th:first-child{z-index:3; background:#fbfbfa;}
  th:hover{color:var(--accent);}
  th::after{content:' \2195'; opacity:.3; font-weight:400;}
  th.sorted-asc::after{content:' \2191' attr(data-rank); opacity:1;}
  th.sorted-desc::after{content:' \2193' attr(data-rank); opacity:1;}
  th.sorted-sub::after{opacity:.5; font-size:.9em;}
  td{color:var(--muted); font-variant-numeric:tabular-nums;}
  td:first-child{color:var(--ink); font-weight:600;}
  td.mp{text-align:left; color:var(--ink); font-weight:600;} th.mp, td.st{text-align:left;}
  td.code{color:var(--faint); font-size:.74rem;}
  td.rgn{font-weight:700; text-decoration:underline dotted rgba(0,0,0,.28); text-underline-offset:3px; cursor:help;}
  td.st{font-size:.72rem; font-weight:700;} td.st.chg{color:var(--ink);}
  tbody tr{cursor:pointer;} tbody tr:hover td{background:#faf9f6;}
  .winpill{display:inline-block; padding:2px 9px; border-radius:6px; font-weight:800; font-size:.68rem; min-width:42px;}
  .notes{font-size:.72rem; color:var(--muted); line-height:1.6; margin-top:28px;}
  .notes b{color:var(--ink);} .notes a{color:var(--accent);}

  /* ---- tooltip card (Nowcast #tip) ---- */
  #tip{position:fixed; pointer-events:none; z-index:60; width:230px; display:none; border-radius:12px; overflow:hidden; box-shadow:0 12px 32px rgba(0,0,0,.2); background:#fff;}
  #tip .hd{background:var(--tipbg); color:#fff; padding:11px 12px 10px;}
  #tip .hd .nm{font-size:1.12rem; font-weight:800; line-height:1.12; letter-spacing:-0.01em;}
  #tip .hd .res{display:flex; gap:4px; align-items:stretch; margin:8px 0 7px; height:26px;}
  #tip .hd .sq{width:27px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:.72rem;}
  #tip .hd .pill{flex:1; border-radius:6px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:.82rem; padding:0 6px; white-space:nowrap; overflow:hidden;}
  #tip .hd .meta{font-size:.72rem; opacity:.92; line-height:1.45;}
  #tip .hd .meta b{font-weight:700;}
  #tip .bd{padding:9px 12px 5px;}
  #tip .bd .lbl{font-size:.6rem; font-weight:800; text-transform:uppercase; letter-spacing:.07em; color:var(--faint); margin:0 0 6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  #tip .r{display:grid; grid-template-columns:32px 1fr 42px; align-items:center; gap:6px; margin-bottom:4px;}
  #tip .r .ab{font-size:.66rem; font-weight:800; text-align:center; padding:2px 0; border-radius:4px;}
  #tip .r .bar{position:relative; height:17px; background:#eee; border-radius:4px; overflow:hidden;}
  #tip .r .bar i{position:absolute; left:0; top:0; height:100%; border-radius:4px;}
  #tip .r .bar span{position:absolute; left:7px; top:0; height:100%; display:flex; align-items:center; font-size:.68rem; font-weight:800; color:#fff;}
  #tip .r .chg{font-size:.64rem; font-weight:800; text-align:center; padding:2px 0; border-radius:4px; background:#f0f0ee; color:var(--faint); font-variant-numeric:tabular-nums;}
  #tip .r .chg.up{color:#16a34a;} #tip .r .chg.down{color:#dc2626;}
  #tip .ft{text-align:center; padding:6px; color:var(--accent); font-weight:800; font-size:.72rem; border-top:1px solid var(--line2);}

  /* ---- tablet / mobile ---- */
  @media(max-width:880px){
    .grid{grid-template-columns:1fr; gap:16px;}
    .r2grid,.topctrls{grid-template-columns:1fr;}
    .r2grid>*,.topctrls>*{grid-column:1 !important; grid-row:auto !important;}
    .r2grid .topctrls{display:contents;}
    .r2grid .section-h{order:1;} .r2grid .mapmodes{order:2;} .r2grid .mapsearch{order:3;} .r2grid .mapgrp{order:4;} .r2grid #map-container{order:5;} .r2grid .mapcredit{order:6; margin-top:0;}
    .r2grid .evh{order:7; margin-top:18px !important;} .r2grid .evf1{order:8;} .r2grid .evf2{order:9;} .r2grid .evbox{order:10;}
    #map-container{height:588px;}
    .evbox{height:460px;}
  }
  @media(max-width:600px){
    .wrap{padding:16px 12px 56px;}
    .panel{padding:15px;}
    #map-container{height:546px;}
    .headline .big{font-size:1.2rem;} .headline .maj{font-size:.8rem;}
    .tot{padding:9px 9px;} .tot .n{font-size:1.4rem;} .tot .nm{font-size:.62rem;}
    .seatbar{height:30px;}
    .mc-big{font-size:2.2rem;}
    .mmb,.mtb{padding:6px 10px; font-size:.72rem;}
    #coalbar svg{height:120px;}
    #coal-total{font-size:1.05rem; gap:4px;} #coal-total .coalchip, #coal-total .coalsep{display:none;}
    .coalbtn .cn{display:none;} .coalbtn{min-width:0; padding:3px 6px; border-radius:6px;} .coalbtn .cab{font-size:.55rem;} #coal-parties{gap:4px; margin-top:10px;}
    table{font-size:.72rem;} th,td{padding:6px 7px;}
  }
  @media(max-width:480px){ .totstrip{grid-template-columns:repeat(2,minmax(0,1fr));} #map-container{height:483px;} .wrap{padding:14px 10px 50px;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead"><span class="modepill" id="modepill">As of &hellip;</span></div>

  <div class="grid">
    <div class="panel hlbox">
      <div class="headline" aria-live="polite"><span class="big" id="hl-party">&mdash;</span><span class="maj" id="hl-maj"></span></div>
      <div class="seatbar" id="seatbar"><div class="majmark"></div></div>
      <div class="totstrip" id="totstrip"></div>
    </div>

    <div class="panel mc" id="govbox">
      <h3>Working majority <span class="sims">excl. Speakers &amp; SF</span></h3>
      <div><div class="mc-big" id="wm-big">&mdash;</div><div class="mc-sub" id="wm-sub"></div></div>
      <div id="wm-chart" aria-label="Working majority since the 2024 election"></div>
      <div class="facts" id="facts"></div>
    </div>

    <div class="fullspan r2grid">
      <div class="topctrls">
        <div class="section-h">Constituency map</div>
        <div class="mapmodes" id="mapmodes" role="group" aria-label="Map view">
          <button class="mmb active" data-m="current">Current</button>
          <button class="mmb" data-m="actual">2024 Result</button>
          <button class="mmb" data-m="change">Changes</button>
          <button class="mmb" data-m="margin">2024 Margin</button>
        </div>
        <div class="mapsearch"><input id="seatsearch" list="seatlist" placeholder="Search for a constituency or MP&hellip;" autocomplete="off" aria-label="Search for a constituency or MP"><datalist id="seatlist"></datalist></div>
        <div class="mapgrp" role="group" aria-label="Map layout and download">
          <button class="mtb active" data-t="geo">Geographic</button>
          <button class="mtb" data-t="hex">Hex</button>
          <button class="mtb" id="dlmap" title="Download a high-resolution PNG of the current map">Download PNG</button>
        </div>
        <div class="section-h evh">Changes since July 2024</div>
        <div class="evf evf1" role="group" aria-label="Filter changes"><button class="mtb active" data-f="all">All changes</button><button class="mtb" data-f="by">By-elections</button></div>
        <div class="evf evf2" role="group" aria-label="Filter changes"><button class="mtb" data-f="def">Defections</button><button class="mtb" data-f="whip">Whip</button></div>
      </div>

      <div id="map-container">
        <div class="maploading" id="maploading">Loading boundaries&hellip;</div>
        <div class="mapbtns"><button id="zin" title="Zoom in" aria-label="Zoom in">+</button><button id="zout" title="Zoom out" aria-label="Zoom out">&minus;</button><button id="mapreset" title="Reset zoom" aria-label="Reset map zoom">R</button></div>
        <div class="legend" id="legend"></div>
      </div>
      <div class="panel insetbox" id="insetbox" aria-label="Zoomed regions"></div>
      <div class="panel evbox">
        <h2>Changes log <span id="evcount"></span></h2>
        <div class="evlist" id="evlist"></div>
      </div>
      <div class="mapcredit" id="mapcredit"></div>
    </div>

    <div class="fullspan">
      <div class="section-h" style="margin-top:36px;">Coalition builder</div>
      <div class="panel" id="coalition">
        <div id="coal-total">0 / 326</div>
        <div id="coalbar"></div>
        <div id="coal-parties"></div>
        <div class="coalnote">Sinn F&eacute;in&rsquo;s 7 MPs do not take their seats and are left out; 326 is a majority of the full House.</div>

  function rgbOf(c){ var h=(c||'#888').replace('#',''); if(h.length===3) h=h.split('').map(function(x){return x+x;}).join('');

  // ---- headline, seat bar, cards ----
  function barOrder(t){

    return L.concat(M,R); }
  function renderTotals(){
    var t=T, top=Object.keys(t).filter(function(p){ return p!=='SPKR'; }).sort(function(a,b){ return t[b]-t[a]; })[0], lead=t[top];
    $('hl-party').textContent=pname(top)+(lead>=MAJ?' Majority':' Largest Party'); $('hl-party').style.color=darkenForText(pc(top));
    var mj=$('hl-maj'); if(lead>=MAJ){ mj.textContent='Majority of '+(2*lead-650); mj.className='maj gov'; } else { mj.textContent=(MAJ-lead)+' short'; mj.className='maj'; }

  // ---- government panel ----

  // working majority after every change since polling day: replay the log from the 2024 result

      var voting=650-sp-depN-sf-vac, g=n-(dep[gp]||0); return g-(voting-g); };

  function drawWM(gp, dep, depN, col){
    var pts=wmSeries(gp, dep, depN), el=$('wm-chart'), W=Math.max(160,Math.round(el.clientWidth||256)), H=72, L=0, R=W-24, T=8, B=H-14;
    var t0=Date.parse(pts[0][0]), t1=Date.parse(pts[pts.length-1][0]);
    var vals=pts.map(function(p){ return p[1]; }), lo=Math.min.apply(null,vals), hi=Math.max.apply(null,vals), pad=Math.max(2,(hi-lo)*0.15);
    var x=function(d){ return L+(R-L)*(Date.parse(d)-t0)/(t1-t0); }, y=function(v){ return B-(B-T)*(v-(lo-pad))/((hi+pad)-(lo-pad)); };

  // ---- tooltip ----
  function barsHTML(sh, base, title){
    var ks=Object.keys(sh).filter(function(p){ return sh[p]>0.0005; }).sort(function(a,b){ return sh[b]-sh[a]; });   // parties that didn't stand are left out

  function fmtMaj(m){ return m?m[0].toLocaleString('en-GB')+' ('+(m[1]*100).toFixed(1)+'%)':''; }
  function showTip(e,d){

    var bd=s.by ? barsHTML(s.by.shares, s.a24, 'By-election · '+fmtDate(s.by.date)) : barsHTML(s.a24, null, '2024 result');
    if(bd) html+='<div class="bd">'+bd+'</div>';
    html+='<div class="ft">'+(window.__LOGO__?'<img src="'+window.__LOGO__+'" alt="electionmapsuk" style="height:20px;vertical-align:middle">':'&#127760; electionmapsuk')+'</div>';
    tip.innerHTML=html; tip.style.display='block';

        var live=XP.filter(Boolean); if(live.length){ var t0=live[0].top, last=live[live.length-1], dy=(availH-(last.top+last.h-t0))/2-(t0-top0); live.forEach(function(o){ o.top+=dy; var tr=o.pj.translate(); o.pj.translate([tr[0],tr[1]+dy]); }); }
        svg+='<line x1="'+(MAPW+IGAP/2)+'" x2="'+(MAPW+IGAP/2)+'" y1="'+top0+'" y2="'+(top0+availH)+'" stroke="#e2ddd6" stroke-width="'+Math.round(3*R)+'"/>';
        INSETS.forEach(function(ins,k){ var feats=XF[k], o=XP[k]; if(!feats) return; var fc={type:'FeatureCollection',features:feats}, b0=path.bounds(fc), bp=Math.round(6*R);
          svg+='<rect x="'+(b0[0][0]-bp)+'" y="'+(b0[0][1]-bp)+'" width="'+(b0[1][0]-b0[0][0]+2*bp)+'" height="'+(b0[1][1]-b0[0][1]+2*bp)+'" fill="none" stroke="#6b7280" stroke-width="'+Math.round(3*R)+'" stroke-dasharray="'+Math.round(14*R)+' '+Math.round(10*R)+'"/>';
          var pp=d3.geoPath().projection(o.pj), zf=o.pj.scale()/proj.scale();
          labels.push({t:(ins.name+' ('+feats.length+')').toUpperCase()+' · ×'+(zf<10?zf.toFixed(1):Math.round(zf)), x:cL+U.PADI*IK, y:o.top+10*IK});
          svg+=feats.map(function(f){ var d=pp(f); return d?'<path d="'+d+'" fill="'+fillFor(codeOf(f))+'" stroke="#fff" stroke-width="'+(0.6*IK)+'" stroke-linejoin="round"/>':''; }).join(''); }); }
      svg+='</svg>';
      var TT=viewMode==='actual'||viewMode==='margin'?T24:T;
      var chips=Object.keys(TT).filter(function(p){ return TT[p]>0 && p!=='SPKR'; }).sort(function(a,b){ return TT[b]-TT[a]; }).slice(0,9);
      var title={current:'Current Parliament · '+fmtDate(D.asOf), actual:'2024 General Election result', change:'Seats changed since the 2024 election · '+fmtDate(D.asOf), margin:'2024 General Election margins'}[viewMode];
      var img=new Image(), font='Inter, Arial, sans-serif';
      img.onload=function(){
        var draw=function(lg){ var cv=document.createElement('canvas'); cv.width=EXPW; cv.height=EXPH; var cx=cv.getContext('2d');
          cx.fillStyle=PANEL; cx.fillRect(0,0,EXPW,EXPH); cx.drawImage(img,0,0);
          cx.fillStyle='#6b7280'; cx.font='800 '+Math.round(INSET_UI.FONT*IK)+'px '+font; cx.textAlign='left'; cx.textBaseline='alphabetic';
          labels.forEach(function(L){ cx.fillText(L.t,L.x,L.y); });
          var F=withIns?1.5:1, chipY=EXPH-foot+Math.round(4*R), ch=Math.round(70*R*F), gap=Math.round(14*R*F); cx.font='900 '+Math.round(32*R*F)+'px '+font;
          var ws=chips.map(function(p){ return Math.max(Math.round(120*R*F), cx.measureText(p+'  '+TT[p]).width+Math.round(40*R*F)); }), totW=ws.reduce(function(a,b){ return a+b+gap; },-gap), x=(EXPW-totW)/2;
          chips.forEach(function(p,i){ var c=pc(p); cx.fillStyle=c; if(cx.roundRect){ cx.beginPath(); cx.roundRect(x,chipY,ws[i],ch,Math.round(12*R)); cx.fill(); } else cx.fillRect(x,chipY,ws[i],ch);
            cx.fillStyle=textOn(c); cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText(p+'  '+TT[p], x+ws[i]/2, chipY+ch/2+Math.round(2*R)); x+=ws[i]+gap; });
          cx.textBaseline='alphabetic';
          var rowY=EXPH-Math.round(46*R);
          if(lg){ var lh=Math.round(80*R*F), lw=Math.round(lg.width*(lh/lg.height)); cx.drawImage(lg,Math.round((EXPW-lw)/2),rowY-Math.round(30*R*F)-lh,lw,lh); }
          cx.textAlign='center'; cx.fillStyle='#004d4d'; cx.font='600 '+Math.round(34*R*F)+'px '+font; cx.fillText(SITE_URL,EXPW/2,rowY);
          cx.font='400 '+Math.round(30*R*F)+'px '+font; cx.fillStyle='#6b7280';
          cx.textAlign='left'; cx.fillText(title,pad,rowY);
          cx.textAlign='right'; cx.fillText(hex?'Hex cartogram · Automatic Knowledge (CC BY 4.0)':'Boundaries © ONS (OGL)',EXPW-pad,rowY);
          return cv; };
        var finish=function(cv){ try{ cv.toBlob(function(b){ download(b,'current-parliament-'+viewMode+'-'+mapType+'.png'); restore(); },'image/png'); }catch(e){ if(cv._logo){ finish(draw(null)); } else restore(); } };
        var lg=new Image(); lg.crossOrigin='anonymous'; lg.onload=function(){ var cv=draw(lg); cv._logo=true; finish(cv); }; lg.onerror=function(){ finish(draw(null)); }; lg.src=window.__LOGO__||LOGO_URL;
      };
      img.onerror=restore;
      var go=function(){ img.src='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(svg))); };
      if(document.fonts&&document.fonts.load) Promise.all([document.fonts.load('800 20px Inter'),document.fonts.load('900 20px Inter'),document.fonts.load('600 20px Inter')]).then(go,go); else go();
    }catch(e){ console.error(e); restore(); }
  }

  // iframe embeds (Squarespace): post the content height so the parent can size the frame
  (function(){ if(window.parent===window) return; document.documentElement.classList.add('embedded');
    var last=0, post=function(){ var w=document.querySelector('.wrap'); var h=Math.ceil(w.getBoundingClientRect().bottom+(window.scrollY||0)); if(Math.abs(h-last)>2){ last=h; try{ window.parent.postMessage({parliamentHeight:h},'*'); }catch(e){} } };
    if(window.ResizeObserver) new ResizeObserver(post).observe(document.body); window.addEventListener('load',post); setTimeout(post,500); })();

  var ib=$('insetbox');
  if(window.ResizeObserver) new ResizeObserver(function(){ clearTimeout(drawInsets._t); drawInsets._t=setTimeout(function(){ if(geo&&mapG&&drawInsets._wh!==ib.clientWidth+'x'+ib.clientHeight) drawInsets(); },80); }).observe(ib);
  var lastW=window.innerWidth; window.addEventListener('resize',function(){ clearTimeout(drawMap._t); drawMap._t=setTimeout(function(){ if(Math.abs(window.innerWidth-lastW)>20){ lastW=window.innerWidth; drawMap(); } },200); });

  setView('current');
  if(window.__PARLIAMENT__) start(window.__PARLIAMENT__);
  else fetch(DATA_URL).then(function(r){ return r.json(); }).then(start).catch(function(e){ $('hl-party').textContent='Could not load data'; console.error(e); });
  var gp=window.__GEO__?Promise.resolve(window.__GEO__):d3.json(GEOJSON_URL);
  gp.then(function(g){ geo=g; drawMap(); }).catch(function(e){ console.error(e); $('maploading').textContent='Could not load the constituency boundaries.'; });
});
