        '): each ward\u2019s last result is swung to the Nowcast, adjusted for recent council by-elections, with ' +
        'Restore Britain placed from the census. It covers the ' + fmt(Object.keys(PROJ.councils).length) +
        ' councils voting. Wales and Scotland start from their 2022 ward results, moved to the May 2026 Senedd and Holyrood results and on to the Senedd Nowcast (Wales) and the GB Nowcast\u2019s Scotland figures (Scotland), with recent by-elections blended in; Scottish seats are allocated by STV quotas. Chances come from ' + fmt(PROJ.meta.nsim) + ' simulations with national, ' +
        'council and ward errors; ranges are the middle 80%. On the projection map, solid fill = projected control at least ' +
        Math.round(PROJ_SURE * 100) + '% likely, paler = less likely, black = no overall control. Ind includes local parties.');
    }
    $('foot').innerHTML = '<p>' + paras.join('</p><p>') + '</p>';
    if(EV && !nextRound().none){
      $('counts').textContent = fmt(nextRound().up.length) + ' councils voting · ' +
        fmt(nextRound().total) + ' seats up';
      return;
    }
    $('counts').textContent = fmt(DATA.meta.councils) + ' councils · ' +
      fmt(DATA.meta.councillors) + ' councillors' +
      (DATA.meta.vacancies ? ' · ' + fmt(DATA.meta.vacancies) + ' vacant seats' : '');
  }

  // returns extra footnote paragraphs, one string each
  function notShownNote(){
    var out = [];
    var ns = (DATA.meta && DATA.meta.notShown) || [];
    if(ns.length){
      out.push('Listed by Open Council Data but not mapped (no published boundary yet): ' +
               ns.map(function(x){ return x.name; }).join(', ') + '.');
    }
    var sup = (DATA.meta && DATA.meta.superseded) || [];
    if(sup.length){
      var by = {};
      sup.forEach(function(x){ (by[x.replacedBy] = by[x.replacedBy] || []).push(x.name); });
      out.push(Object.keys(by).map(function(k){
        return k + ' is shown in place of ' + by[k].join(', ');
      }).join('; ') + ' — those councils run services until 1 April 2027, ' +
      'but their successors were the ones elected most recently.');
    }
    return out;
  }

  // ------------------------------------------------------------------- map --
  // Both tiers are drawn at once and share a single zoom transform, so panning
  // one lines the other up on the same ground.
  var TIERS = [
    {key: 'lower', box: 'map-lower', label: 'districts and unitary authorities'},
    {key: 'upper', box: 'map-upper', label: 'county councils and unitary authorities'}
  ];
  var M = {};            // tier key -> {svg, defs, g, zoom, path, drawn}
  var syncing = false;
  var wardExiting = false;   // map zooming back out of a ward view: don't drag the other along

  function tierShown(key){ return mapMode === key; }

  function eachMap(fn){
    TIERS.forEach(function(t){ if(M[t.key] && M[t.key].g) fn(M[t.key], t); });
  }
  // only the maps currently on screen - a hidden one has no usable geometry
  function eachShown(fn){
    TIERS.forEach(function(t){ if(tierShown(t.key) && M[t.key] && M[t.key].g) fn(M[t.key], t); });
  }

  function drawMaps(){
    leaveWards(true, true);
    TIERS.forEach(function(t){
      if(!tierShown(t.key)) return;
      if(GEO[t.key]) return drawMap(t, GEO[t.key]);
      loadJson('boundaries-' + t.key + '.json').then(function(g){
        GEO[t.key] = g; if(tierShown(t.key)) drawMap(t, g);
      }).catch(function(e){ console.error('boundary layer unavailable', t.key, e); });
    });
  }

  // Switch tier without moving: the other tier's councils are drawn in the
  // same place at the same zoom. A ward view carries across if its council
  // is on both tiers (a unitary); otherwise you land on the councils there.
  function setMapMode(mode){
    if(mapMode === mode) return Promise.resolve();
    var old = M[mapMode];
    var view = old && old.svg ? d3.zoomTransform(old.svg.node()) : d3.zoomIdentity;
    var ward = WARD ? {code: WARD.code, prev: WARD.prev, pin: WARD.pin} : null;
    var pinned = pinnedGss;
    return (GEO[mode] ? Promise.resolve(GEO[mode]) : loadJson('boundaries-' + mode + '.json'))
      .then(function(g){
        GEO[mode] = g;
        mapMode = mode;
        document.querySelectorAll('[data-maps]').forEach(function(x){
          x.classList.toggle('active', x.getAttribute('data-maps') === mode);
        });
        var tr = $('tiertrack');
        if(tr){
          tr.classList.toggle('up', mode === 'upper');
          tr.setAttribute('aria-checked', mode === 'upper' ? 'true' : 'false');
          tr.setAttribute('aria-label', mode === 'upper' ? 'Show the lower tier' : 'Show the upper tier');
        }
        var grid = document.querySelector('.mapgrid');
        grid.classList.toggle('only-lower', mode === 'lower');
        grid.classList.toggle('only-upper', mode === 'upper');
        drawMaps();
        var m = M[mode];
        if(!m || !m.svg) return;
        m.svg.call(m.zoom.transform, view);
        if(ward && byGss[ward.code] && byGss[ward.code].wards && featureIn(m, ward.code)){
          enterWards(m, ward.code, {prev: ward.prev});
        } else if(pinned && featureIn(m, pinned)){
          pinnedGss = pinned; markPinned(); showCardFor(pinned, '', null);
        }
      });
  }

  function drawMap(t, g){
    var m = M[t.key] || (M[t.key] = {});
    m.key = t.key;
    m.box = t.box;
    var cont = d3.select('#' + t.box);
    cont.select('svg').remove();
    m.wg = null;
    var box = $(t.box).getBoundingClientRect();
    var w = Math.max(220, box.width), h = Math.max(260, box.height);

    m.svg = cont.append('svg').attr('width','100%').attr('height',h)
      .attr('viewBox','0 0 '+w+' '+h)
      .attr('role','img')
      .attr('aria-label','Map of UK ' + t.label + ' coloured by political control. ' +
            'The same data is available in the table below.');
    m.defs = m.svg.append('defs');
    m.g = m.svg.append('g');
    m.patternScale = 1;

    // Both tiers share one projection, fitted to the lower tier, so a zoom
    // transform means the same place on either and switching keeps the view.
    var proj = d3.geoMercator().fitExtent([[10,10],[w-10,h-10]], GEO.lower || g);
    m.path = d3.geoPath().projection(proj);

    m.g.selectAll('path.cp').data(g.features).enter().append('path')
      .attr('class','cp').attr('d', m.path)
      // elections view: a council not voting is greyed out and can't be
      // hovered or clicked into
      .classed('out', function(d){ return !inPlay(byGss[d.properties.code]); })
      .on('mousemove', function(e,d){ if(!pinnedGss && !(WARD && WARD.pin)) showFeature(e,d); })
      .on('mouseleave', function(){ if(!pinnedGss) clearCard(); })
      .on('click', function(e,d){
        var code = d.properties.code, cc = byGss[code];
        if(cc && cc.wards) return enterWards(m, code);
        // a neighbour with no ward data, clicked from a ward view
        if(WARD){ leaveWards(true, false, true); return zoomTo(code); }
        pinnedGss = (pinnedGss === code) ? null : code;
        markPinned();
        if(pinnedGss) showFeature(e,d); else clearCard();
      });

    // elections view: a dotted line round each new mayoralty being elected
    if(EV) MAYORAL_RACES.forEach(function(race){
      var feats = g.features.filter(function(f){ return race.codes.indexOf(f.properties.code) >= 0; });
      if(!feats.length) return;
      m.g.append('path').attr('class', 'mayor').datum(regionOutline(feats)).attr('d', m.path)
        .append('title').text(race.name + ' mayor - first election');
    });

    // deep enough for a London borough to fill the panel in the ward view
    m.zoom = d3.zoom().scaleExtent([1,220]).on('end', function(){
      // a pinned ward's card was hidden while the map moved: put it back
      if(WARD && WARD.m === m && WARD.pin) showWardCard(wardPoint(WARD.pin), WARD.pin);
    }).on('zoom', function(e){
      m.g.attr('transform', e.transform);
      scalePatterns(m, e.transform.k);
      if(!pinnedGss && (!panelOn() || WARD)) tip.style.display = 'none';
      // In the ward view the other map stays where it was.
      if(!syncing && !WARD && !wardExiting){
        syncing = true;
        eachShown(function(other){
          if(other !== m && other.zoom) other.svg.call(other.zoom.transform, e.transform);
        });
        syncing = false;
      }
    });
    m.svg.call(m.zoom);
    scalePatterns(m, 1);
    recolour();
    markPinned();
  }

  function markPinned(){
    eachMap(function(m){
      m.g.selectAll('.cp').classed('pinned', function(d){
        return !!pinnedGss && d.properties.code === pinnedGss;
      });
    });
  }

  function recolour(){
    eachMap(function(m){
      m.g.selectAll('.cp').attr('fill', function(d){ return fillFor(byGss[d.properties.code], m); });
    });
    buildLegend();
    highlight(focusParty);
    drawPVL();
  }

  function resetView(){
    leaveWards(true);
    var first = null;
    eachShown(function(m){ if(!first) first = m; });
    if(first) first.svg.transition().duration(500).call(first.zoom.transform, d3.zoomIdentity);
    pinnedGss = null; markPinned(); clearCard();
  }

  // The transform that frames one council in a map, filling `fill` of the panel.
  function fitTransform(m, feature, fill, maxK){
    var box = m.svg.node().getBoundingClientRect();
    var W = box.width, H = box.height;
    var b = m.path.bounds(feature);
    var dx = b[1][0]-b[0][0], dy = b[1][1]-b[0][1];
    var k = Math.max(1, Math.min(maxK, fill/Math.max(dx/W, dy/H)));
    var cx = (b[0][0]+b[1][0])/2, cy = (b[0][1]+b[1][1])/2;
    return d3.zoomIdentity.translate(W/2 - k*cx, H/2 - k*cy).scale(k);
  }
  function featureIn(m, gss){
    var found = null;
    if(m && m.g) m.g.selectAll('.cp').each(function(d){ if(!found && d.properties.code === gss) found = d; });
    return found;
  }

  function zoomTo(gss){
    var found = null, host = null;
    eachShown(function(m){
      if(found) return;
      var f = featureIn(m, gss);
      if(f){ found = f; host = m; }
    });
    if(!found) return;
    host.svg.transition().duration(700).call(host.zoom.transform, fitTransform(host, found, 0.55, 40));
    pinnedGss = gss;
    markPinned();
    showCardFor(gss, '', null);
  }

  // ------------------------------------------------------------ ward view --
  // Clicking a council swaps it, in that map only, for its wards: filled by the
  // party of each ward's councillors, striped where they differ. The other map
  // stays put. Boundaries come from data/wards/<code>.json, councillors from
  // data/members/<code>.json; a council only offers this when the build placed
  // enough of its councillors on its wards (council.wards).
  var WARD = null;                 // {m, code, prev, geo, mem}
  var WCACHE = {};

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"]/g, function(ch){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch];
    });
  }
  // Detailed council outlines for the ward view (merged from the wards, so
  // their edges meet the wards exactly); one file per map, fetched once.
  var OUTLINES = {};
  function outlinesFor(tier){
    if(!OUTLINES[tier]){
      OUTLINES[tier] = loadJson('wards/outlines-' + tier + '.json', true)
        .catch(function(e){ delete OUTLINES[tier]; throw e; });
    }
    return OUTLINES[tier];
  }
  function sharpenNeighbours(m){
    outlinesFor(m.key).then(function(o){
      if(!WARD || WARD.m !== m) return;
      m.g.selectAll('.cp').attr('d', function(d){
        var g = o[d.properties.code];
        return m.path(g ? {type: 'Feature', geometry: g} : d);
      });
    }).catch(function(){ /* keep the national boundaries */ });
  }

  // a council on new wards from May 2027 (PROJ.meta.newb): in projection mode
  // its wards are the new ones, with no councillors yet
  function newbOf(code){ return !!(PROJ && PROJ.meta && PROJ.meta.newb && PROJ.meta.newb[code]); }
  function wardsFor(code){
    if(pvOn() && newbOf(code)){
      var nk = 'N:' + code;
      // the council's own file first; failing that, its new wards out of the national
      // projection topology (projection-wards-2027.topo.json), named from PROJW
      if(!WCACHE[nk]) WCACHE[nk] = loadJson('wards-2027/' + code + '.json', true)
        .catch(function(){
          return Promise.all([loadPVL(), loadProjW()]).then(function(){
            var pw = (PROJW && PROJW.councils[code]) || {};
            var ws = (PVL || []).filter(function(f){ return f.properties.c === code; });
            if(!ws.length) throw new Error('no 2027 wards for ' + code);
            return {code: code, wards: ws.map(function(f){
              return {id: f.properties.id, name: pw[f.properties.id] ? pw[f.properties.id].n : '', alt: '', g: f.geometry};
            })};
          });
        })
        .then(function(geo){ return [geo, {wards: {}, labels: {}, unmatched: {}}]; })
        .catch(function(e){ delete WCACHE[nk]; throw e; });
      return WCACHE[nk];
    }
    if(!WCACHE[code]){
      WCACHE[code] = Promise.all([loadJson('wards/' + code + '.json', true),
                                  loadJson('members/' + code + '.json', true)])
        .catch(function(e){ delete WCACHE[code]; throw e; });
    }
    return WCACHE[code];
  }
  // A ward's seats as party codes, in spectrum order, vacancies last - one
  // entry per seat, so stripes come out in proportion.
  function wardCodes(people){
    return (people || []).map(function(p){ return p.p; }).sort(function(a, b){
      if(a === b) return 0;
      if(a === 'VAC') return 1;
      if(b === 'VAC') return -1;
      return DATA.spectrum.indexOf(a) - DATA.spectrum.indexOf(b);
    });
  }
  // One stripe per seat. A party's second and third seats in a ward are drawn
  // a shade darker each, so a ward held 3-0 still shows as three seats, and
  // LAB/LAB/RES reads as two Labour seats rather than one wide band.
  var SEAT_SHADE = 0.1;
  function darken(hex, amount){
    var h = (hex||'#888').replace('#','');
    if(h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    return '#' + [0, 2, 4].map(function(i){
      var v = Math.round(parseInt(h.slice(i, i+2), 16) * (1 - amount));
      return (v < 16 ? '0' : '') + v.toString(16);
    }).join('');
  }
  // Scotland and Northern Ireland elect by STV in big multi-member wards: there
  // each councillor gets one band running the full width of the ward, instead
  // of the fine repeating stripes, so a 3-member ward reads as three thick
  // bands and a 6-member one as six thinner ones.
  // the year a council's next seats are up, if it elects in parts
  function partYear(c){
    if(!c || (c.cycle || []).length < 2) return null;
    return ((c.nextElection || (c.cycle[0] || {}).date) || '').slice(0, 4) || null;
  }
  // the councillors to draw for a ward: all, or only those up next
  function shownPeople(id){
    // projection mode: one entry per projected seat, so the fills, stripes,
    // ward list and party highlighting all work as they do for councillors
    var pw = WARD && projWards(WARD.code);
    if(pw){
      var e = pw[id], out = [];
      if(!e) return out;
      Object.keys(e.w).forEach(function(p){
        for(var i = 0; i < e.w[p]; i++) out.push({p: p, n: 'Projected ' + pInfo(p).name, y: WARD.upYear || '2027', proj: 1});
      });
      return out;
    }
    var ppl = (WARD && WARD.mem && WARD.mem.wards[id]) || [];
    if(!UPONLY || !WARD.upYear) return ppl;
    return ppl.filter(function(p){ return String(p.y) === WARD.upYear; });
  }
  function seatShades(codes){
    var seen = {};
    return codes.map(function(code){
      var nth = seen[code] = (seen[code] || 0) + 1;
      return darken(pInfo(code).colour, (nth - 1) * SEAT_SHADE);
    });
  }
  // The bands run at one fixed angle everywhere (the same "/" as the stripes
  // elsewhere), measured across the ward itself, not its bounding box - a
  // box-relative gradient tilts with each ward's shape. Every band is the same
  // width, edge to edge of the ward.
  function wardRings(m, f){
    var proj = m.path.projection(), g = f.geometry, out = [];
    var polys = g.type === 'Polygon' ? [g.coordinates] : g.type === 'MultiPolygon' ? g.coordinates : [];
    polys.forEach(function(p){ p.forEach(function(r){ out.push(r.map(function(pt){ return proj(pt); })); }); });
    return out;
  }
  // area of the part of the ward with x + y <= t (holes wind the other way)
  function areaBelow(rings, t){
    var a = 0;
    rings.forEach(function(r){
      var o = [];
      for(var i = 0; i < r.length; i++){
        var p = r[i], q = r[(i + 1) % r.length];
        var pin = p[0] + p[1] <= t, qin = q[0] + q[1] <= t;
        if(pin) o.push(p);
        if(pin !== qin){
          var k = (t - p[0] - p[1]) / ((q[0] + q[1]) - (p[0] + p[1]));
          o.push([p[0] + k * (q[0] - p[0]), p[1] + k * (q[1] - p[1])]);
        }
      }
      for(var j = 0; j < o.length; j++){
        var u = o[j], v = o[(j + 1) % o.length];
        a += (u[0] * v[1] - v[0] * u[1]) / 2;
      }
    });
    return Math.abs(a);
  }
  // The parts of a ward the bands are measured across: its biggest pieces of
  // land, leaving out small offshore islands - a scatter of tiny islands
  // would otherwise stretch the bands so far that most councillors' bands
  // fall in open sea. Keeps the largest parts until they hold 90% of the
  // area, plus any part at least a tenth the size of the largest.
  function mainParts(m, f){
    var proj = m.path.projection(), g = f.geometry;
    var polys = g.type === 'Polygon' ? [g.coordinates] : g.type === 'MultiPolygon' ? g.coordinates : [];
    var parts = polys.map(function(p){
      var r = (p[0] || []).map(function(pt){ return proj(pt); }), a = 0;
      for(var i = 0; i < r.length; i++){
        var u = r[i], v = r[(i + 1) % r.length];
        a += u[0] * v[1] - v[0] * u[1];
      }
      return {ring: r, area: Math.abs(a / 2)};
    }).filter(function(x){ return x.ring.length; })
      .sort(function(x, y){ return y.area - x.area; });
    if(parts.length < 2) return parts.map(function(x){ return x.ring; });
    var total = parts.reduce(function(a, x){ return a + x.area; }, 0), kept = [], sum = 0;
    parts.forEach(function(x, i){
      if(i === 0 || sum < 0.9 * total || x.area >= 0.1 * parts[0].area){ kept.push(x.ring); sum += x.area; }
    });
    return kept;
  }
  function bandFill(m, codes, f){
    var id = 'wb-' + m.key + '-' + String(f.properties.id).replace(/[^\w-]/g, '_') + '-' + codes.join('-');
    if(m.defs && m.defs.select('#' + id).empty()){
      var lo = Infinity, hi = -Infinity;
      mainParts(m, f).forEach(function(r){ r.forEach(function(p){
        var t = p[0] + p[1]; if(t < lo) lo = t; if(t > hi) hi = t;
      }); });
      // equal widths across the ward's full extent at that angle
      var n = codes.length, cuts = [];
      for(var k = 0; k < n; k++) cuts.push(k / n);
      cuts.push(1);
      var gr = m.defs.append('linearGradient').attr('id', id)
        .attr('gradientUnits', 'userSpaceOnUse')
        .attr('x1', lo / 2).attr('y1', lo / 2).attr('x2', hi / 2).attr('y2', hi / 2);
      seatShades(codes).forEach(function(col, i){
        gr.append('stop').attr('offset', cuts[i]).attr('stop-color', col);
        gr.append('stop').attr('offset', cuts[i + 1]).attr('stop-color', col);
      });
    }
    return 'url(#' + id + ')';
  }
  function isSTV(code){
    var c = byGss[code];
    return !!c && (c.nation === 'Scotland' || c.nation === 'Northern Ireland');
  }
  function wardFill(m, people, stv, f){
    var codes = wardCodes(people);
    if(!codes.length) return '#e6e6e2';
    if(codes.length === 1) return pInfo(codes[0]).colour;
    if(stv && f) return bandFill(m, codes, f);
    var id = 'ws-' + m.key + '-' + codes.join('-');
    if(m.defs && m.defs.select('#' + id).empty()){
      var pat = m.defs.append('pattern').attr('id', id)
        .attr('width', TIE_BAND * codes.length).attr('height', 8)
        .attr('patternUnits', 'userSpaceOnUse')
        .attr('patternTransform', 'rotate(45) scale(' + (m.patternScale || 1) + ')');
      var seen = {};
      codes.forEach(function(code, i){
        var nth = seen[code] = (seen[code] || 0) + 1;
        pat.append('rect').attr('x', i * TIE_BAND).attr('width', TIE_BAND + 0.15)
           .attr('height', 8).attr('fill', darken(pInfo(code).colour, (nth - 1) * SEAT_SHADE));
      });
    }
    return 'url(#' + id + ')';
  }
  function isDivisions(geo){ return !!geo && /^CED/i.test(geo.source || ''); }
  // Northern Ireland elects by District Electoral Area, several councillors each
  function isDEA(geo){ return !!geo && /^DEA/i.test(geo.source || ''); }
  // what to call a council's units: ward / division / electoral area
  function unitWord(geo, plural){
    var w = isDEA(geo) ? 'electoral area' : isDivisions(geo) ? 'division' : 'ward';
    return plural ? w + 's' : w;
  }
  function wardName(n){ return String(n || '').replace(/\s+ED$/, ''); }
  // The name to show for a ward: the one its councillors were elected under
  // when the build matched it by shared place names (a renamed or redrawn
  // ward), otherwise the boundary file's own.
  function wardLabel(id, fallback){
    var l = WARD && WARD.mem && WARD.mem.labels && WARD.mem.labels[id];
    return wardName(l || fallback);
  }

  function wardBar(m, c, geo, mem){
    var box = d3.select('#' + m.box);
    box.select('.wardbar').remove();
    var bar = box.append('div').attr('class', 'wardbar');
    bar.append('button').attr('class', 'wback').attr('type', 'button')
      .text('\u2190 All councils')
      .on('click', function(e){ e.stopPropagation(); leaveWards(); });
    var what = '';
    if(geo){
      var un = mem ? Object.keys(mem.unmatched || {}) : [];
      var nUn = un.reduce(function(a, k){ return a + mem.unmatched[k].length; }, 0);
      what = geo.wards.length + ' ' + unitWord(geo, true) +
             (nUn ? ' \u00b7 ' + nUn + ' councillor' + (nUn > 1 ? 's' : '') + ' not mapped' : '');
      bar.append('div').attr('class', 'wt')
        .attr('title', nUn ? 'Not placed on the map: ' + un.join(', ') : null)
        .html(esc(c.name) + ' <span>' + what + '</span>');
    } else {
      bar.append('div').attr('class', 'wt').html(esc(c.name) + ' <span>loading wards\u2026</span>');
    }
    if(geo && WARD && WARD.upYear){
      bar.append('button').attr('type', 'button').attr('class', 'wup' + (UPONLY ? ' on' : ''))
        .attr('aria-pressed', UPONLY ? 'true' : 'false')
        .attr('title', c.name + ' elects by ' + cycleWord((c.cycle || []).length).toLowerCase() +
              ': show only the councillors whose seats are up in May ' + WARD.upYear)
        .text('Only seats up in ' + WARD.upYear)
        .on('click', function(e){ e.stopPropagation(); UPONLY = !UPONLY; refreshWards(); });
    }
  }

  // Redraw the wards after the seats-up toggle: fills, list, bar, card.
  function refreshWards(){
    if(!WARD || !WARD.m.wg) return;
    var m = WARD.m, stv = isSTV(WARD.code);
    m.wg.selectAll('.wd').attr('fill', function(d){ return wardFill(m, shownPeople(d.properties.id), stv, d); });
    d3.select('#' + m.box).select('.wup').classed('on', UPONLY).attr('aria-pressed', UPONLY ? 'true' : 'false');
    var wl = $('wlist'), top = wl ? wl.scrollTop : 0;
    buildWardPanel();
    if($('wlist')) $('wlist').scrollTop = top;
    markWardPin();
    highlight(focusParty);
    if(WARD.pin) showWardCard(wardPoint(WARD.pin), WARD.pin);
  }

  function tierOf(key){ return TIERS.filter(function(t){ return t.key === key; })[0]; }

  // keep: {prev} when a tier switch carries the ward view across - stay put
  // and remember where "All councils" should return to.
  function enterWards(m, code, keep){
    var c = byGss[code];
    var f = featureIn(m, code);
    if(!c || !f) return;
    // Going from one council's wards straight to another's: stay where you
    // are and fly across, and remember the view from before the first one.
    var carry = null;
    if(WARD){ carry = WARD.prev; leaveWards(true, false, true); }
    var tier = m.key;
    WARD = {m: m, tier: tier, code: code,
            prev: keep ? keep.prev : (carry || d3.zoomTransform(m.svg.node()))};
    pinnedGss = null; markPinned();
    tip.style.display = 'none';
    m.g.selectAll('.pvl,.pvb').style('display', 'none');
    mobileCard();
    sharpenNeighbours(m);
    wardBar(m, c, null, null);
    if(!keep) m.svg.transition().duration(650).call(m.zoom.transform, fitTransform(m, f, 0.86, 220));
    clearCard();
    wardsFor(code).then(function(a){
      if(!WARD || WARD.code !== code || WARD.m !== m) return;
      drawWards(m, c, a[0], a[1]);
    }).catch(function(e){
      if(window.console) console.warn('ward view for ' + code + ' failed:', e);
      if(!WARD || WARD.code !== code) return;
      leaveWards(true);
      pinnedGss = code; markPinned(); showCardFor(code, '', null);
    });
  }

  function drawWards(m, c, geo, mem){
    WARD.geo = geo; WARD.mem = mem;
    if(pvOn() && !PROJW) loadProjW();
    WARD.upYear = partYear(c);
    m.g.selectAll('.cp').classed('bg', true)
      .classed('inward', function(d){ return d.properties.code === c.gss; });
    if(m.wg) m.wg.remove();
    m.wg = m.g.append('g').attr('class', 'wardlayer');
    var feats = geo.wards.map(function(w){
      return {type: 'Feature', geometry: w.g, properties: {id: w.id, name: w.name, alt: w.alt}};
    });
    m.wg.selectAll('path.wd').data(feats).enter().append('path')
      .attr('class', 'wd').attr('d', m.path)
      .attr('fill', function(d){ return wardFill(m, shownPeople(d.properties.id), isSTV(c.gss), d); })
      .on('mousemove', function(e, d){ markWardRow(d.properties.id); if(!WARD.pin) showWardCard(e, d); })
      .on('mouseleave', function(){ markWardRow(null); if(!WARD || !WARD.pin) clearCard(); })
      // click or tap pins a ward's card, as a click pins a council's; on a
      // phone this is what keeps the card open after the tap
      .on('click', function(e, d){
        e.stopPropagation();
        WARD.pin = (WARD.pin && WARD.pin.properties.id === d.properties.id) ? null : d;
        markWardPin();
        if(WARD.pin) showWardCard(e, d); else clearCard();
      });
    // the council's own boundary on top of its wards
    var outline = geo.outline ? {type: 'Feature', geometry: geo.outline} : featureIn(m, c.gss);
    if(outline) m.wg.append('path').datum(outline).attr('class', 'wbound').attr('d', m.path);
    scalePatterns(m, d3.zoomTransform(m.svg.node()).k);
    wardBar(m, c, geo, mem);
    buildWardPanel();
    highlight(focusParty);
    if(WARD.focus){ var fid = WARD.focus; WARD.focus = null; focusWard(fid); }
  }

  function focusWard(id){
    if(!WARD || !WARD.m.wg) return;
    var m = WARD.m, hit = null;
    m.wg.selectAll('.wd').each(function(d){ if(d.properties.id === id) hit = d; });
    if(!hit) return;
    WARD.pin = hit;
    markWardPin();
    var t = fitTransform(m, hit, 0.4, 220);
    if(!panelOn()){
      // Narrow screens float the card over the map, so park the ward in the
      // top of the map and hang the card underneath it, not on top of it.
      var H = m.svg.node().getBoundingClientRect().height;
      t = fitTransform(m, hit, 0.28, 220);
      t = d3.zoomIdentity.translate(t.x, t.y - H * 0.2).scale(t.k);
    }
    m.svg.transition().duration(650).call(m.zoom.transform, t)
      .on('end', function(){
        if(!WARD || WARD.pin !== hit) return;
        showWardCard(wardPoint(hit), hit);
      });
    showWardCard(null, hit);
  }

  function markWardPin(){
    if(WARD && WARD.m.wg) WARD.m.wg.selectAll('.wd').classed('pinned', function(d){
      return !!WARD.pin && d.properties.id === WARD.pin.properties.id;
    });
    var wl = $('wlist'), id = WARD && WARD.pin ? WARD.pin.properties.id : null;
    if(wl) wl.querySelectorAll('.wl').forEach(function(r){
      var on = r.getAttribute('data-id') === id;
      r.classList.toggle('on', on);
      if(on && r.scrollIntoView) r.scrollIntoView({block: 'nearest'});
    });
  }

  // noRedraw: the caller is about to redraw every map anyway (layout change).
  // stay: undo the ward view without moving the map (going on to another council)
  function leaveWards(instant, noRedraw, stay){
    if(!WARD) return;
    var w = WARD, m = w.m;
    WARD = null;
    mobileCard();
    if(m.wg){ m.wg.remove(); m.wg = null; }
    d3.select('#' + m.box).select('.wardbar').remove();
    m.g && m.g.selectAll('.pvl,.pvb').style('display', null);
    tip.style.display = 'none';
    if(!noRedraw && m.g && m.svg.node().isConnected){
      // back to the national shapes and full colour, then zoom back out
      m.g.selectAll('.cp').classed('bg', false).classed('inward', false).attr('d', m.path);
      if(stay) {}
      else if(instant) m.svg.call(m.zoom.transform, w.prev);
      else m.svg.transition().duration(600).call(m.zoom.transform, w.prev);
    }
    clearCard();
  }

  // lower case without accents, so "carlabhagh" finds "Càrlabhagh"
  function fold(s){
    s = String(s || '');
    return (s.normalize ? s.normalize('NFD').replace(/[\u0300-\u036f]/g, '') : s).toLowerCase();
  }
  function bare(s){ return String(s || '').toLowerCase().replace(/\b(the|party)\b|[^a-z]/g, ''); }
  function projWardCard(c, props, e, people, geo){
    var P7 = (PROJW.meta && PROJW.meta.parties) || ['RFM', 'LAB', 'CON', 'LDM', 'GRN', 'IND', 'RES'];
    var head = '<div class="hd"><div class="nm">' + esc(wardLabel(props.id, props.name)) + '</div>' +
      '<div class="ty">' + esc(c.name) + ' \u00b7 ' + (newbOf(c.gss) ? 'New ward from May 2027' : isDivisions(geo) ? 'Electoral division' : 'Ward') + ' \u00b7 2027 projection</div>';
    if(!e) return head + '<div class="meta" style="margin-top:7px">No seat up here in 2027</div></div>';
    var sh = P7.map(function(p, i){ return [p, e.s[i] / 10]; }).filter(function(x){ return x[1] >= 0.5; })
      .sort(function(a, b){ return b[1] - a[1]; });
    var nUp = Object.keys(e.w).reduce(function(a, p){ return a + e.w[p]; }, 0);
    var win = Object.keys(e.w).sort(function(a, b){ return e.w[b] - e.w[a]; });
    var chip = function(p, t){ var col = pInfo(p).colour; return '<span style="display:inline-block; padding:2px 6px; margin:0 3px 3px 0; border-radius:4px; font-size:.66rem; font-weight:800; background:' + col + '; color:' + txtOn(col) + '">' + (t || abbrev(p)) + '</span>'; };
    var upNow = (people || []).filter(function(p){ return !WARD || !WARD.upYear || String(p.y) === WARD.upYear; });
    var max = sh.length ? sh[0][1] : 1;
    var bars = sh.slice(0, 6).map(function(x){
      var col = pInfo(x[0]).colour, won = e.w[x[0]] || 0;
      return '<div style="display:grid; grid-template-columns:34px 1fr 38px; gap:6px; align-items:center; margin-bottom:4px; font-size:.7rem; font-weight:800">' +
        '<span style="color:' + col + '">' + abbrev(x[0]) + '</span>' +
        '<span style="position:relative; height:12px; background:#f0efeb; border-radius:3px; overflow:hidden"><i style="display:block; height:100%; width:' + (100 * x[1] / max) + '%; background:' + col + '"></i></span>' +
        '<span style="text-align:right; color:' + (won ? 'var(--ink)' : 'var(--muted)') + '">' + x[1].toFixed(0) + '%' + '</span></div>';
    }).join('');
    var lead = sh.length > 1 ? (sh[0][1] - sh[1][1]) : 0;
    return head +
      '<div class="res" style="margin-top:8px">' + win.map(function(p){ var col = pInfo(p).colour;
        return '<div class="pill" style="background:' + col + '; color:' + txtOn(col) + '">' + abbrev(p) + (e.w[p] > 1 || nUp > 1 ? ' ' + e.w[p] : '') + '</div>'; }).join('') + '</div>' +
      '<div class="meta"><b>' + nUp + '</b> seat' + (nUp > 1 ? 's' : '') + ' up \u00b7 ' + abbrev(sh[0][0]) + ' leads by <b>' + (lead < 0.05 ? 'under 0.1' : lead.toFixed(1)) + '</b> pts over ' + abbrev(sh[1] ? sh[1][0] : sh[0][0]) + '</div></div>' +
      '<div class="stack">' + sh.map(function(x){ return '<i style="width:' + x[1] + '%; background:' + pInfo(x[0]).colour + '"></i>'; }).join('') + '</div>' +
      '<div style="padding:9px 12px 6px"><div style="font-size:.6rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); margin-bottom:6px">Projected vote</div>' + bars +
      (upNow.length ? '<div style="font-size:.6rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); margin:8px 0 5px">Seats up now held by</div>' +
        upNow.map(function(p){ return chip(p.p); }).join('') : '') +
      (e.fb ? '<div style="font-size:.66rem; color:var(--faint); margin-top:4px">No ward-level result: council-wide figures</div>' : '') + '</div>';
  }
  function wardCardHtml(c, props, people, geo){
    if(projWards(c.gss)) return projWardCard(c, props, projWards(c.gss)[props.id], people, geo);
    var ppl = people || [], div = isDivisions(geo);
    var codes = wardCodes(ppl);
    var stack = codes.map(function(p){
      return '<i style="width:' + (100 / codes.length) + '%; background:' + pInfo(p).colour + '"></i>';
    }).join('');
    var rows = ppl.length ? ppl.map(function(p){
      var col = pInfo(p.p).colour;
      // The group's own name under the councillor, for the catch-all tags
      // only - and not when it just repeats the tag (RES / Restore Britain).
      var own = p.pn && !/^independent( \/ other)?$/i.test(p.pn) &&
                ['OTH', 'IND', 'RES', 'LOC', 'NIP', 'CIP'].indexOf(p.p) >= 0 &&
                bare(p.pn) !== bare(pInfo(p.p).name) ? '<small>' + esc(p.pn) + '</small>' : '';
      var faded = UPONLY && WARD && WARD.upYear && String(p.y) !== WARD.upYear;
      return '<div class="cr' + (faded ? ' notup' : '') + '"><div class="ab" title="' + esc(pInfo(p.p).name) + '" style="background:' + col +
        '; color:' + txtOn(col) + '">' + abbrev(p.p) + '</div><div class="who">' +
        esc(p.p === 'VAC' ? 'Vacant seat' : p.n) + own + '</div><div class="yr" title="End of term">' +
        (p.y || '') + '</div></div>';
    }).join('') : '<div class="none">No councillor is listed for this ' + unitWord(geo) +
      ' in the source data.</div>';
    var years = ppl.map(function(p){ return p.y; }).filter(Boolean).sort();
    var n = ppl.filter(function(p){ return p.p !== 'VAC'; }).length;
    return '<div class="hd">' +
        '<div class="nm">' + esc(wardLabel(props.id, props.name)) + '</div>' +
        '<div class="ty">' + esc(c.name) + ' \u00b7 ' + (isDEA(geo) ? 'District electoral area' : div ? 'Electoral division' : 'Ward') +
          (props.alt ? ' \u00b7 ' + esc(props.alt) : '') + '</div>' +
        '<div class="meta" style="margin-top:7px"><b>' + n + '</b> councillor' + (n === 1 ? '' : 's') +
          (ppl.length > n ? ' \u00b7 <b>' + (ppl.length - n) + '</b> vacant' : '') +
          (UPONLY && WARD && WARD.upYear ? ' \u00b7 <b>' + ppl.filter(function(p){ return String(p.y) === WARD.upYear; }).length +
             '</b> up in ' + WARD.upYear : '') + '</div>' +
      '</div>' +
      (stack ? '<div class="stack">' + stack + '</div>' : '') +
      '<div class="bd">' + rows + '</div>' +
      (years.length ? '<div class="ft">Next election here: May ' + years[0] + '</div>' : '');
  }

  // In the ward view the panel holds the council's card and the ward list;
  // only the card is ever replaced, so the list keeps its scroll position.
  function setPanel(html){
    var dc = $('dcouncil');
    if(WARD && dc) dc.innerHTML = html;
    else {
      var det = $('detail'), el = $('elist');
      if(el) ELEC_SCROLL = el.scrollTop;
      det.classList.remove('hasw', 'hase'); det.style.height = '';
      det.innerHTML = html;
    }
  }
  // The ward-view panel is exactly the map's height, so the ward list scrolls
  // inside it rather than running on below the map.
  function fitPanel(){
    var det = $('detail');
    var box = det.classList.contains('hasw') && WARD ? WARD.m.box
            : det.classList.contains('hase') ? 'map-' + mapMode : null;
    if(!box) return;
    var h = $(box).getBoundingClientRect().height;
    if(h) det.style.height = Math.round(h) + 'px';
  }
  // Narrow screens have no side panel: the council's card goes under the map.
  function mobileCard(){
    var mc = $('mcard');
    if(!mc) return;
    var on = !!WARD && !panelOn() && !!byGss[WARD.code];
    mc.classList.toggle('on', on);
    mc.innerHTML = on ? cardHtml(byGss[WARD.code]) : '';
  }
  function wardListHtml(){
    var ws = WARD.geo.wards.slice().sort(function(a, b){
      return wardLabel(a.id, a.name).localeCompare(wardLabel(b.id, b.name));
    });
    var div = isDivisions(WARD.geo);
    return '<div class="wlh">' + ws.length + ' ' + unitWord(WARD.geo, true) + '</div>' +
      ws.map(function(w){
        var codes = wardCodes(shownPeople(w.id));
        var chips = codes.length ? codes.map(function(p){
          var col = pInfo(p).colour;
          return '<i style="background:' + col + '; color:' + txtOn(col) + '" title="' +
            esc(pInfo(p).name) + '">' + abbrev(p) + '</i>';
        }).join('') : '<i class="none">' + ((WARD.mem.wards[w.id] || []).length ? 'not up' : 'no data') + '</i>';
        return '<div class="wl" data-id="' + esc(w.id) + '"><span class="wn">' + esc(wardLabel(w.id, w.name)) +
          '</span><span class="wc">' + chips + '</span></div>';
      }).join('');
  }

  function buildWardPanel(){
    if(!panelOn() || !WARD || !WARD.geo) return;
    var det = $('detail');
    det.classList.add('hasw');
    det.innerHTML = '<div class="pbox" id="dcouncil">' + cardHtml(byGss[WARD.code]) + '</div>' +
      '<div class="pbox wlist" id="wlist">' + wardListHtml() + '</div>';
    fitPanel();
    var byId = {};
    WARD.m.wg.selectAll('.wd').each(function(d){ byId[d.properties.id] = {d: d, el: this}; });
    det.querySelectorAll('.wl').forEach(function(row){
      var hit = byId[row.getAttribute('data-id')];
      if(!hit) return;
      row.addEventListener('mouseenter', function(){
        d3.select(hit.el).classed('hl', true).raise();
        if(!WARD.pin) showWardCard(null, hit.d);
      });
      row.addEventListener('mouseleave', function(){
        d3.select(hit.el).classed('hl', false);
        if(WARD && !WARD.pin) clearCard();
      });
      row.addEventListener('click', function(){
        WARD.pin = (WARD.pin && WARD.pin.properties.id === hit.d.properties.id) ? null : hit.d;
        markWardPin();
        if(WARD.pin) showWardCard(null, hit.d); else clearCard();
      });
    });
    clearCard();
    highlight(focusParty);
  }
  // the list row for a ward hovered on the map
  function markWardRow(id){
    var wl = $('wlist');
    if(wl) wl.querySelectorAll('.wl').forEach(function(r){ r.classList.toggle('hov', r.getAttribute('data-id') === id); });
  }

  function showWardCard(e, d){
    if(!WARD || !WARD.mem) return;
    var html = wardCardHtml(byGss[WARD.code], d.properties, WARD.mem.wards[d.properties.id], WARD.geo);
    // Floats over the map: at the pointer when there is one, otherwise (a row
    // in the list, a pinned ward, a search) at the ward itself.
    var pt = e || (panelOn() ? wardPoint(d) : null);
    if(!pt) return;
    tip.innerHTML = html;
    place(pt);
  }
  // Where to hang a ward's card with no pointer to go by: by its middle on a
  // wide screen, under it on a narrow one - kept within the map either way.
  function wardPoint(d){
    if(!WARD || !WARD.m.wg) return null;
    var m = WARD.m, el = null;
    m.wg.selectAll('.wd').each(function(x){
      if(x.properties.id === d.properties.id) el = this;
    });
    if(!el) return null;
    var wb = el.getBoundingClientRect(), r = $(m.box).getBoundingClientRect();
    if(!panelOn()) return {clientX: r.left - 16, clientY: Math.min(wb.bottom, r.bottom) - 8};
    return {clientX: Math.max(r.left, Math.min(wb.left + wb.width / 2, r.right - 40)),
            clientY: Math.max(r.top, Math.min(wb.top + wb.height / 2, r.bottom - 40))};
  }

  // ------------------------------------------------------------------ card --
  // Shading for a party's seats by when they are next up.
  function cycleShade(colour, i, n){
    return lighten(colour, n > 1 ? (i / (n - 1)) * 0.62 : 0);
  }
  function shortDate(iso){
    var d = new Date(iso);
    return isNaN(d) ? iso : d.toLocaleDateString('en-GB',{month:'short',year:'numeric'});
  }
  function cycleWord(n){
    return n <= 1 ? 'All-out' : n === 2 ? 'Halves' : n === 3 ? 'Thirds' : n + ' cycles';
  }

  // The same card is used by the floating tooltip (narrow screens) and by the
  // side panel (wide screens).
  // chance of each outcome, as on the snake popup: one stacked bar, labelled where there's room, with a key
  function chanceBarHtml(pj){
    var pc = function(k){ return k === 'NOC' ? NOC_COLOUR : pInfo(k).colour; };
    var lab = function(k){ return k === 'NOC' ? 'NOC' : abbrev(k); };
    var outs = Object.keys(pj.pc || {}).filter(function(k){ return pj.pc[k] >= 0.01; }).sort(function(a, b){ return pj.pc[b] - pj.pc[a]; });
    var tot = outs.reduce(function(a, k){ return a + pj.pc[k]; }, 0) || 1;
    return '<div class="cb">' + outs.map(function(k){
        var w = 100 * pj.pc[k] / tot, bg = pc(k);
        return '<i style="width:' + w + '%; background:' + bg + '; color:' + txtOn(bg) + '">' + (w >= 15 ? lab(k) + ' ' + Math.round(100 * pj.pc[k]) + '%' : '') + '</i>';
      }).join('') + '</div>' +
      (function(){   // a key only for the slices too narrow to carry their own label
        var small = outs.filter(function(k){ return 100 * pj.pc[k] / tot < 15; });
        return small.length ? '<div class="ck">' + small.map(function(k){
          return '<span><i style="background:' + pc(k) + '"></i><b>' + lab(k) + '</b> ' + Math.round(100 * pj.pc[k]) + '%</span>';
        }).join('') + '</div>' : '';
      })();
  }
  // seats after May as one stacked bar, with the majority line and a key
  function seatStripHtml(pj, order){
    var T = pj.total || 0, need = Math.floor(T / 2) + 1;
    if(!T) return '';
    return '<div class="pjl" style="margin:10px 0 6px">Seats after May</div>' +
      '<div class="ss"><div class="sb">' + order.map(function(p){
        var c = pInfo(p).colour, w = 100 * pj.comp[p] / T;
        return '<i style="width:' + w + '%; background:' + c + '; color:' + txtOn(c) + '">' + (w >= 8 ? pj.comp[p] : '') + '</i>';
      }).join('') + '</div><b class="sm" style="left:' + (100 * need / T) + '%"></b></div>' +
      // key only for parties too small to carry their number in the bar
      '<div class="ck">' + order.filter(function(p){ return 100 * pj.comp[p] / T < 8; }).map(function(p){
        return '<span><i style="background:' + pInfo(p).colour + '"></i><b>' + abbrev(p) + '</b> ' + pj.comp[p] + '</span>';
      }).join('') + '<span style="margin-left:auto">' + need + ' for a majority</span></div>';
  }
  // the council card in 2027-projection mode: the council after May in the same bars as now
  function projCardHtml(c, pj){
    var T = pj.total || c.total, maj = Math.floor(T / 2) + 1, comp = pj.comp || {}, won = pj.won || {}, rg = pj.rg || {};
    var order = Object.keys(comp).filter(function(p){ return comp[p]; })
      .sort(function(a, b){ return (comp[b] - comp[a]) || (DATA.spectrum.indexOf(a) - DATA.spectrum.indexOf(b)); });
    // change on the council now (independents and local groups together, as in the projection); parties that lose
    // every seat stay on the card at 0
    var MAINP = {RFM:1, LAB:1, CON:1, LDM:1, GRN:1, RES:1, PLC:1, SNP:1}, cur = {};
    Object.keys(c.seats || {}).forEach(function(p){ if(p === 'VAC' || !c.seats[p]) return; var k = MAINP[p] ? p : 'IND'; cur[k] = (cur[k] || 0) + c.seats[p]; });
    comp = Object.assign({}, comp);
    Object.keys(cur).sort(function(a, b){ return cur[b] - cur[a]; }).forEach(function(p){ if(!comp[p]){ comp[p] = 0; order.push(p); } });
    var dl = function(p){ var d = (comp[p] || 0) - (cur[p] || 0);
      return d ? '<span class="dl ' + (d > 0 ? 'up' : 'dn') + '" title="' + (d > 0 ? 'up ' : 'down ') + Math.abs(d) + ' on now">' + (d > 0 ? '+' : '\u2212') + Math.abs(d) + '</span>'
               : '<span class="dl" title="no change on now">\u2013</span>'; };

  // The outside edge of a group of councils: their boundaries share edges
  // exactly, so an edge used twice is internal and dropped; what is left is
  // chained into lines.
  function regionOutline(feats){
    var key = function(p){ return p[0].toFixed(6) + ',' + p[1].toFixed(6); };
    var segs = {}, list = [];
    feats.forEach(function(f){
      var gm = f.geometry, polys = gm.type === 'Polygon' ? [gm.coordinates] : gm.type === 'MultiPolygon' ? gm.coordinates : [];
      polys.forEach(function(poly){ poly.forEach(function(r){
        for(var i = 0; i < r.length - 1; i++){
          var a = r[i], b = r[i + 1], ka = key(a), kb = key(b);
          if(ka === kb) continue;
          var k = ka < kb ? ka + '|' + kb : kb + '|' + ka;
          if(segs[k]) segs[k].n++;
          else { segs[k] = {a: a, b: b, ka: ka, kb: kb, n: 1}; list.push(segs[k]); }
        }
      }); });
    });
    var outer = list.filter(function(x){ return x.n === 1; }), adj = {};
    outer.forEach(function(x){ (adj[x.ka] = adj[x.ka] || []).push(x); (adj[x.kb] = adj[x.kb] || []).push(x); });
    var lines = [];
    outer.forEach(function(x){
      if(x.used) return;
      x.used = true;
      var line = [x.a, x.b], end = x.kb;
      for(;;){
        var nx = (adj[end] || []).filter(function(t){ return !t.used; })[0];
        if(!nx) break;
        nx.used = true;
        if(nx.ka === end){ line.push(nx.b); end = nx.kb; } else { line.push(nx.a); end = nx.ka; }
      }
      lines.push(line);
    });

  // A party that can't lose its majority at the next election: even losing
  // every one of its seats that is up, the seats it keeps are still more than

  // {p, keep, need, up, held} or null.
  function safeHold(c){
    var u = upOf(c);

    for(var p in c.seats){
      if(p === 'VAC' || !c.seats[p]) continue;

    if(!best || c.seats[best] * 2 <= c.total) return null;
    var up = (u.seats || {})[best] || 0, keep = c.seats[best] - up;

  // Majority meters: one bar per council voting, against its own majority
  // line. The bar is the council's seats: first the lead party's seats that
  // aren't up (solid), then its seats that are (hatched), then everyone
  // else's - up (hatched grey) and not up (grey). Where the solid part alone
  // passes the line the majority can't be lost; otherwise the hatched part
  // shows how much of what is up it has to hold, or win. Sorted from the
  // councils closest to changing hands. Northern Ireland, with its power-shared
  // councils, is left out.
  // switched off for now: the section stays hidden and isn't built
  var SHOW_METERS = false;
  var MM = {party: '', show: 'all', open: false};
  var MM_ROWS = 25;
  function meterRows(){
    return (nextRound().up || []).filter(function(u){ return u.c.nation !== 'Northern Ireland'; })
      .map(function(u){
        var c = u.c, up = u.seats || {}, total = c.total, half = Math.floor(total / 2);
        var R = runsKey(c), noc = !R || R === 'NOC';
        if(noc){ var tp = topParties(c); R = tp[0] || null; }
        var held = R ? c.seats[R] || 0 : 0, rUp = R ? up[R] || 0 : 0, keep = held - rUp;
        var vac = c.seats.VAC || 0, othUp = Math.max(0, u.n - rUp);
        var othKeep = Math.max(0, total - held - othUp - vac);
        var st, rank;
        if(keep > half){ st = 'safe'; rank = 4e6 + (keep - half); }
        else if(held > half){

          st = 'risk'; rank = k;
        } else {
          var need = half + 1 - held;       // gains needed for a majority
          // a majority k losses from falling and one n gains from being won
          // are interleaved, closest first
          if(need <= othUp){ st = 'reach'; rank = need + 0.5; }
          else { st = 'out'; rank = 2e6 + need; }

    var need = x.half + 1 - x.held;
    if(x.st === 'reach') return need + ' gain' + (need === 1 ? '' : 's') + ' from a majority';
    return 'can’t reach a majority this time';

    $('mmParty').addEventListener('change', function(){ MM.party = this.value; drawMeters(); });
    $('mmShow').addEventListener('change', function(){ MM.show = this.value; drawMeters(); });
    $('mmMore').addEventListener('click', function(){ MM.open = !MM.open; drawMeters(); });
    drawMeters();
  }
  function drawMeters(){
    var list = $('mmList');
    if(!list) return;
    var rows = meterRows().filter(function(x){
      if(MM.party && x.R !== MM.party) return false;
      if(MM.show === 'change') return x.st === 'risk' || x.st === 'reach';
      if(MM.show !== 'all') return x.st === MM.show;
      return true;
    }).sort(function(a, b){ return a.rank - b.rank || a.c.name.localeCompare(b.c.name); });
    var shown = MM.open ? rows : rows.slice(0, MM_ROWS);
    list.innerHTML = shown.length ? shown.map(function(x){
      var col = x.R ? pInfo(x.R).colour : NOC_COLOUR, pale = lighten(col, 0.55);
      var w = function(n){ return (100 * n / x.total).toFixed(3) + '%'; };
      var seg = function(n, style, title){
        return n > 0 ? '<i style="width:' + w(n) + '; ' + style + '" title="' + title + '"></i>' : '';
      };
      var hatch = function(a, b){ return 'background:repeating-linear-gradient(45deg,' + a + ' 0 3px,' + b + ' 3px 6px)'; };
      var a = x.R ? abbrev(x.R) : 'Largest';
      var bar = seg(x.keep, 'background:' + col, a + ': ' + x.keep + ' seats not up') +
        seg(x.rUp, hatch(col, pale), a + ': ' + x.rUp + ' seats up') +
        seg(x.othUp, hatch('#b9b9b4', '#e4e4e0'), 'Others: ' + x.othUp + ' seats up') +
        seg(x.othKeep, 'background:#dcdcd8', 'Others: ' + x.othKeep + ' seats not up') +
        seg(x.vac, 'background:#f1f1ee', x.vac + ' vacant');
      var line = (100 * (x.half + 0.5) / x.total).toFixed(3);
      var ctrl = controlSwatch(x.c);
      return '<div class="mm-row st-' + x.st + '" data-g="' + x.c.gss + '">' +
        '<span class="mm-name">' + esc(x.c.name) +
          '<b class="mm-ctrl" style="background:' + ctrl + '; color:' + txtOn(ctrl) + '">' + esc(shortControl(x.c)) + '</b></span>' +
        '<span class="mm-bar">' + bar + '<em style="left:' + line + '%"></em></span>' +
        '<span class="mm-txt">' + (x.R ? '<b>' + esc(abbrev(x.R)) + '</b> ' : '') + meterText(x) +
          '<small>' + (x.u.all ? 'all ' + x.u.n : x.u.n + ' of ' + x.total) + ' up</small></span>' +
      '</div>';
    }).join('') : '<div class="none" style="padding:14px 4px; font-size:.78rem; color:var(--muted)">No councils match.</div>';
    $('mmCount').textContent = 'Showing ' + shown.length + ' of ' + rows.length + ' councils';
    var more = $('mmMore');
    more.style.display = rows.length > MM_ROWS ? '' : 'none';
    more.textContent = MM.open ? 'Show fewer' : 'Show all ' + rows.length;
    list.querySelectorAll('.mm-row').forEach(function(r){
      var g = r.getAttribute('data-g');
      r.addEventListener('mouseenter', function(){
        eachShown(function(m){
          m.g.selectAll('.cp').filter(function(d){ return d.properties.code === g; }).classed('lhl', true).raise();
        });
      });
      r.addEventListener('mouseleave', function(){
        eachMap(function(m){ m.g.selectAll('.cp.lhl').classed('lhl', false); });
      });
      r.addEventListener('click', function(){
        eachMap(function(m){ m.g.selectAll('.cp.lhl').classed('lhl', false); });
        var mg = document.querySelector('.mapgrid');
        if(mg && mg.scrollIntoView) mg.scrollIntoView({behavior: 'smooth', block: 'start'});
        gotoCouncil(g);
      });
    });
  }

  function panelDefault(){
    var E = nextRound();
    if(E.none){
      setPanel('<div class="empty"><h3>Local elections</h3><p>No upcoming elections in the data.</p></div>');
      return;
    }
    var d = new Date(E.date + 'T12:00:00');
    var when = d.toLocaleDateString('en-GB', {weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'});
    // every party with a seat up gets its own row, largest first; the
    // catch-all Oth goes last
    var keys = Object.keys(E.seats).sort(function(a, b){ return E.seats[b] - E.seats[a]; });
    var rows = keys.filter(function(k){ return k !== 'OTH'; })
      .map(function(k){ return [k, E.seats[k]]; });
    if(E.seats.OTH) rows.push(['OTH', E.seats.OTH]);
    var bar = rows.map(function(r){
      return '<i title="' + esc(pInfo(r[0]).name) + ' ' + fmt(r[1]) + '" style="width:' +
             (100 * r[1] / E.total) + '%; background:' + pInfo(r[0]).colour + '"></i>';
    }).join('');
    var grid = rows.map(function(r){
      return '<div title="' + esc(pInfo(r[0]).name) + '"><span><i style="background:' +
             pInfo(r[0]).colour + '"></i>' + abbrev(r[0]) + '</span><b>' + fmt(r[1]) + '</b></div>';
    }).join('');
    var list = NATIONS.map(function(nat){
      var g = E.up.filter(function(u){ return u.c.nation === nat; })
        .sort(function(a, b){ return a.c.name.localeCompare(b.c.name); });
      if(!g.length) return '';
      return '<div class="elh">' + nat + ' \u00b7 ' + g.length + '</div>' + g.map(function(u){
        var pj = pvOn() ? projOf(u.c) : null;
        var col = pj ? projColour(pj) : controlSwatch(u.c);
        return '<div class="el" data-g="' + u.c.gss + '" title="' + esc(pj ? '2027 projection: ' + projText(pj) : controlText(u.c)) + '">' +
          '<span class="en">' + esc(u.c.name) + '</span>' +
          '<span class="es">' + (safeHold(u.c) ? '<span title="Can\u2019t lose its majority this time" style="color:var(--ink)">' + LOCK_SVG + '</span> ' : '') +
            (u.all ? 'all ' + u.n : u.n + ' of ' + u.c.total) + '</span>' +
          '<span class="ec" style="background:' + col + '; color:' + txtOn(col) + '">' +
          esc(pj ? projShort(pj) : shortControl(u.c)) + '</span></div>';
      }).join('');
    }).join('');
    setPanel(
      '<div class="elec-hd"><h3>' + (EV ? 'Councils voting' : d.getFullYear() + ' local elections') + '</h3>' +
        '<p>' + when + ' \u00b7 <b>' + fmt(E.up.length) + '</b> councils \u00b7 <b>' +
        fmt(E.total) + '</b> seats up</p>' +
        (EV ? '' : '<div class="elec-lbl">Seats being defended</div>' +
        '<div class="elec-bar">' + bar + '</div>' +
        '<div class="elec-grid">' + grid + '</div>') +
      '</div>' +
      '<div class="elist" id="elist">' + list + '</div>');
    var det = $('detail');
    det.classList.add('hase');
    fitPanel();
    var el = $('elist');
    el.scrollTop = ELEC_SCROLL;
    el.addEventListener('scroll', function(){ ELEC_SCROLL = el.scrollTop; });
    el.querySelectorAll('.el').forEach(function(row){
      var g = row.getAttribute('data-g');
      row.addEventListener('mouseenter', function(){
        eachShown(function(m){
          m.g.selectAll('.cp').filter(function(d){ return d.properties.code === g; })
            .classed('lhl', true).raise();
        });
      });
      row.addEventListener('mouseleave', function(){
        eachMap(function(m){ m.g.selectAll('.cp.lhl').classed('lhl', false); });
      });
      row.addEventListener('click', function(){
        eachMap(function(m){ m.g.selectAll('.cp.lhl').classed('lhl', false); });
        gotoCouncil(g);
      });
    });
  }

  function showCardFor(code, name, e){
    var html = cardHtml(byGss[code], name);
    if(panelOn()){
      // In the ward view the panel keeps this council; a neighbour hovered on
      // the map gets a floating header instead.
      if(WARD && $('dcouncil') && code !== WARD.code){
        tip.innerHTML = '<div class="nbr">' + html + '<div class="hint">Click to see its ' +
               (byGss[code] && byGss[code].wards ? 'wards' : 'council') + '</div></div>';
        if(e) place(e); else tip.style.display = 'none';
        return;
      }
      setPanel(html);
      tip.style.display = 'none';
    } else {
      tip.innerHTML = html;
      if(e){ place(e); }
      else {
        // no pointer position - reached from search, so centre it on the map
        var box = $('map-lower').getBoundingClientRect();
        place({clientX: box.left + box.width/2,
               clientY: box.top + Math.min(box.height/2, 220)});
      }
    }
  }

  function showFeature(e, d){ showCardFor(d.properties.code, d.properties.name, e); }

  function clearCard(){
    tip.style.display = 'none';
    if(panelOn()){
      if(WARD && WARD.pin) showWardCard(null, WARD.pin);
      else if(WARD && $('dcouncil')) {}
      else if(WARD) showCardFor(WARD.code, '', null);
      else if(pinnedGss) showCardFor(pinnedGss, '', null); else panelDefault();
    }
  }

  function place(e){
    tip.style.display = 'block';
    var r = tip.getBoundingClientRect();
    var x = e.clientX + 16, y = e.clientY + 16;
    // flip to the other side if it would overrun, then clamp so a narrow
    // screen can never push the card off the edge
    if(x + r.width  > window.innerWidth  - 8) x = e.clientX - r.width - 16;
    if(y + r.height > window.innerHeight - 8) y = window.innerHeight - r.height - 8;
    tip.style.left = Math.max(8, Math.min(x, window.innerWidth  - r.width  - 8)) + 'px';
    tip.style.top  = Math.max(8, Math.min(y, window.innerHeight - r.height - 8)) + 'px';
  }

  // ---------------------------------------------------------------- legend --
  function buildLegend(){
    if(!DATA) return;
    var counts = focusCounts();
    var keys = Object.keys(counts).filter(function(k){ return k!=='NOC' && k!=='TIED'; })
      .sort(function(a,b){ return counts[b]-counts[a]; });
    if(counts.TIED) keys.push('TIED');
    if(counts.NOC) keys.push('NOC');
    $('legend').innerHTML = keys.map(function(k){
      var col = k==='NOC' ? NOC_COLOUR : k==='TIED' ? TIE_NEUTRAL : pInfo(k).colour;
      var nm  = k==='TIED' ? 'Tied' : k==='NOC' ? (colourMode==='largest' ? 'None' : 'NOC') : abbrev(k);
      var full = k==='TIED' ? 'Two or more parties level on seats'
               : k==='NOC' ? (colourMode==='largest' ? 'No seats' : 'No overall control, no administration')
               : pInfo(k).name;
      return '<span class="lgd" data-k="'+k+'" title="'+full+'"><i style="background:'+col+'"></i>'+nm+
             ' <b>'+counts[k]+'</b></span>';
    }).join('') + (EV ? '<span class="lgd lgdx" title="Not voting in ' + nextRound().date.slice(0, 4) +
      '"><i style="background:' + OUT_FILL + '"></i>Not voting <b>' +
      fmt(DATA.councils.length - nextRound().up.length) + '</b></span>' +
      '<span class="lgd lgdx" title="New mayors elected for the first time: ' +
        MAYORAL_RACES.map(function(r){ return r.name; }).join(', ') + '">' +
        '<i style="background:none; border:2px dashed #15171a"></i>New mayor</span>' : '') +
      (pvOn() && noProj() ? '<span class="lgd lgdx" title="Voting in ' + nextRound().date.slice(0, 4) +
        ' but not in the projection, which covers the English councils"><i style="background:' + NOPROJ_FILL +
        '"></i>Not projected <b>' + fmt(noProj()) + '</b></span>' : '') +
      (pvOn() ? '<span class="lgd lgdx" title="Projected control less than ' + Math.round(PROJ_SURE * 100) +
        '% likely"><i style="background:' + lighten('#6b7280', 0.5) + '"></i>Paler: under ' + Math.round(PROJ_SURE * 100) + '% likely</span>' : '');
    $('legend').querySelectorAll('.lgd').forEach(function(el){
      el.addEventListener('click', function(){
        var k = el.getAttribute('data-k');
        if(!k) return;
        var turnOff = (focusParty === k);
        focusParty = turnOff ? null : k;
        $('legend').querySelectorAll('.lgd').forEach(function(x){
          x.classList.toggle('off', !!focusParty && x.getAttribute('data-k') !== focusParty);
        });
        $('tiles').querySelectorAll('.tot').forEach(function(x){
          x.classList.toggle('on', !!focusParty && x.getAttribute('data-p') === focusParty);
        });
        highlight(focusParty);
      });
    });
    if(focusParty && !counts[focusParty]) focusParty = null;
  }

  // ----------------------------------------------------------------- table --
  function tableRows(){
    var list = EV ? electionRows() : DATA.councils.slice();
    var dir = sortDir;
    list.sort(function(a,b){
      var x, y;
      if(sortKey === 'name'){ x=a.name; y=b.name; return dir * (x<y?-1:x>y?1:0); }
      if(sortKey === 'type'){ x=a.typeName||''; y=b.typeName||''; return dir * (x<y?-1:x>y?1:0); }
      if(sortKey === 'control'){ x=controlText(a); y=controlText(b); return dir * (x<y?-1:x>y?1:0); }
      if(sortKey === 'total'){ return dir * (a.total-b.total); }
      if(sortKey === 'up'){ return dir * ((a._up || 0) - (b._up || 0)); }
      if(sortKey === 'proj'){ x = projOf(a) ? projText(projOf(a)) : ''; y = projOf(b) ? projText(projOf(b)) : ''; return dir * (x<y?-1:x>y?1:0); }
      if(sortKey === 'chance'){ var ca = projOf(a), cb = projOf(b);
        return dir * (((ca && ca.pc[ca.next]) || 0) - ((cb && cb.pc[cb.next]) || 0)); }
      return dir * ((a.seats[sortKey]||0) - (b.seats[sortKey]||0));
    });
    return list;
  }

  // Northern Ireland's parties share no columns with Great Britain's, so the
  // two get their own tables rather than one very wide sparse one.
  // Column order for the table (and the CSV). Its own order, not the map's
  // left-right spectrum. LIB sits with the Lib Dems and UKIP with the SDP; the
  // Northern Ireland parties only ever appear in the NI table.
  var TABLE_ORDER = ['ASP','YRP','WPB','SF','PLC','SNP','GRN','SDLP','LAB','LDM','LIB','ALL',
                     'IND','LOC','NIP','CIP','UUP','CON','DUP','TUV','RFM','SDP','UKI','RES','OTH','VAC'];
  function tableOrder(){
    var extra = DATA.spectrum.filter(function(p){ return TABLE_ORDER.indexOf(p) < 0; });
    return TABLE_ORDER.slice(0, -2).concat(extra, ['OTH', 'VAC']);
  }
  function partyCols(list){
    var have = {};
    list.forEach(function(c){
      for(var p in c.seats){ if(c.seats[p]) have[p] = 1; }
    });
    return tableOrder().filter(function(p){ return have[p]; });
  }

  // The table's control column in the ElectionMaps abbreviations, coalitions
  // included - OCD's own labels say REF and LD where the rest of the page says
  // RFM and LDM.
  function shortControl(c){
    var ct = c.control;
    if(!ct || ct.type === 'noc' || !ct.parties.length) return (ct && ct.label === 'TBC') ? 'TBC' : 'NOC';
    var names = ct.parties.map(abbrev).join('/');
    if(ct.mayor || ct.type === 'mayoral') return names + ' mayor';
    if(ct.type === 'minority') return names + ' min';
    return names;
  }

  function renderTable(el, list, cols){
    var head = '<thead><tr>' +
      '<th data-k="name">Council</th><th data-k="type">Type</th>' +
      '<th data-k="control">Control</th>' +
      (EV ? '<th data-k="up" title="Seats being contested">Seats up</th>' : '') +
      (EV && PROJ ? '<th data-k="proj" title="Projected control after May 2027">Projected</th>' +
                    '<th data-k="chance" title="Chance of the projected control outcome">Chance</th>' : '') +
      cols.map(function(p){ return '<th data-k="'+p+'" title="'+pInfo(p).name+'">'+abbrev(p)+'</th>'; }).join('') +
      '<th data-k="total">Total</th></tr></thead>';
    var body = '<tbody>' + list.map(function(c){
      var col = controlSwatch(c);   // this is the Control column, not the map
      return '<tr><td>'+c.name+'</td><td style="color:var(--muted)">'+(c.typeName||'')+'</td>' +
        '<td class="ctrl" style="background:'+col+'; color:'+txtOn(col)+'">'+
        shortControl(c)+'</td>' +
        (EV ? '<td class="num" style="color:var(--ink); font-weight:700">' +
              (c._all ? 'All ' + c._up : c._up + ' of ' + c.total) +
              (c._safe ? ' <span title="' + abbrev(c._safe) + ' can\u2019t lose its majority this time">' + LOCK_SVG + '</span>' : '') + '</td>' : '') +
        (EV && PROJ ? (function(){ var pj = projOf(c); if(!pj) return '<td></td><td></td>';
            var pc = projColour(pj);
            return '<td class="ctrl" style="background:' + pc + '; color:' + txtOn(pc) + '" title="' + esc(projText(pj)) + '">' +
              (pj.next === 'NOC' ? 'NOC' : abbrev(pj.next)) + '</td><td class="num" title="' + esc(chanceHtml(pj, 3).replace(/<[^>]+>/g, '')) + '">' +
              Math.round((pj.pc[pj.next] || 0) * 100) + '%</td>'; })() : '') +
        cols.map(function(p){ return '<td class="num">'+(c.seats[p]||'')+'</td>'; }).join('') +
        '<td class="num" style="color:var(--ink); font-weight:700">'+c.total+'</td></tr>';
    }).join('') + '</tbody>';
    el.innerHTML = head + body;
    el.querySelectorAll('th').forEach(function(th){
      th.addEventListener('click', function(){
        var k = th.getAttribute('data-k');
        if(sortKey === k) sortDir = -sortDir;
        else { sortKey = k; sortDir = (k==='name'||k==='type'||k==='control'||k==='proj') ? 1 : -1; }
        buildTable();
      });
    });
  }

  var tableOpen = false;

  function buildTable(){
    var all = tableRows();
    var ni = all.filter(function(c){ return c.nation === 'Northern Ireland'; });
    var gb = all.filter(function(c){ return c.nation !== 'Northern Ireland'; });
    renderTable($('tbl'), gb, partyCols(gb));
    renderTable($('tbl-ni'), ni, partyCols(ni));
    tablesVisible(tableOpen);
  }

  function tablesVisible(on){
    tableOpen = on;
    var ni = DATA.councils.some(function(c){ return c.nation === 'Northern Ireland'; });
    $('tablewrap').style.display = on ? 'block' : 'none';
    $('ni-head').style.display = (on && ni) ? '' : 'none';
    $('tablewrap-ni').style.display = (on && ni) ? 'block' : 'none';
  }

  function downloadCsv(){
    var rows = tableRows();
    var cols = EV ? partyCols(rows) : tableOrder().filter(function(p){ return DATA.meta.partyTotals[p]; });
    var head = ['Council','Type','Nation','Region','GSS','Control','ControlType']
      .concat(EV ? ['Seats up'] : [])
      .concat(EV && PROJ ? ['Projected control 2027', 'Chance of projected control'] : [])
      .concat(cols.map(function(p){ return pInfo(p).name + (EV ? ' seats up' : ''); })).concat(['Total']);
    var lines = [head.join(',')];
    rows.forEach(function(c){
      var row = ['"'+c.name.replace(/"/g,'""')+'"', '"'+(c.typeName||'')+'"', c.nation, '"'+(c.region||'')+'"',
                 c.gss, '"'+c.control.label+'"', c.control.type]
        .concat(EV ? [c._up] : [])
        .concat(EV && PROJ ? (projOf(c) ? ['"' + projText(projOf(c)) + '"', (projOf(c).pc[projOf(c).next] || 0).toFixed(2)] : ['', '']) : [])
        .concat(cols.map(function(p){ return c.seats[p]||0; })).concat([c.total]);
      lines.push(row.join(','));
    });
    var blob = new Blob([lines.join('\n')], {type:'text/csv;charset=utf-8'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (EV ? 'local-elections-' + nextRound().date.slice(0, 4) + '-'
                     : 'uk-council-control-') + DATA.meta.generated.slice(0,10) + '.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
  }

  // ------------------------------------------------------------------ wire --
  function wire(){
    document.querySelectorAll('[data-maps]').forEach(function(b){
      b.addEventListener('click', function(){ setMapMode(b.getAttribute('data-maps')); });
    });
    $('tiertrack').addEventListener('click', function(){
      setMapMode(mapMode === 'lower' ? 'upper' : 'lower');
    });
    document.querySelectorAll('[data-colour]').forEach(function(b){
      b.addEventListener('click', function(){
        document.querySelectorAll('[data-colour]').forEach(function(x){ x.classList.remove('active'); });
        b.classList.add('active');
        colourMode = b.getAttribute('data-colour');
        recolour(); buildTable();
        if(!pinnedGss) clearCard();
      });
    });
    document.querySelectorAll('[data-pv]').forEach(function(b){
      b.addEventListener('click', function(){
        var on = b.getAttribute('data-pv') === '1';
        if(on === PV) return;
        PV = on; focusParty = null;
        if(PV){ loadProjW(); }
        setPvButtons(); pvHeads();
        buildTiles(); buildNatBar(); recolour(); buildTable();
        if(WARD && WARD.geo){
          if(newbOf(WARD.code)) enterWards(WARD.m, WARD.code, {prev: WARD.prev});   // swap to / from the new wards
          if(PV && !PROJW) loadProjW(); else if(!newbOf(WARD.code)) refreshWards();
        }
        else if(!pinnedGss) panelDefault();
        else showCardFor(pinnedGss, '', null);
      });
    });
    $('reset').addEventListener('click', resetView);
    $('tabletog').addEventListener('click', function(){
      tablesVisible(!tableOpen);
      $('tabletog').textContent = tableOpen ? 'Hide tables' : 'Show full table';
      $('tabletog').classList.toggle('active', tableOpen);
    });
    $('csvbtn').addEventListener('click', downloadCsv);

    // search
    var q = $('q'), sg = $('sugg'), selIdx = -1;

    function closeSugg(){ sg.style.display = 'none'; selIdx = -1; }
    function markSel(){
      sg.querySelectorAll('div').forEach(function(el, i){ el.classList.toggle('sel', i === selIdx); });
    }
    function choose(el){
      if(!el) return;
      gotoCouncil(el.getAttribute('data-g'), el.getAttribute('data-w'));
      closeSugg(); q.value = ''; q.blur();
    }

    // Wards are searchable too: the names-only ward index is fetched the
    // first time someone types, and only councils with a ward view are listed.
    var WLIST = null, wlistLoading = false;
    function wardIndex(){
      if(WLIST || wlistLoading) return;
      wlistLoading = true;
      loadJson('wards/index.json', true).then(function(ix){
        var out = [];
        Object.keys(ix).forEach(function(code){
          var c = byGss[code];
          if(!c || !c.wards || !inPlay(c)) return;
          ix[code].forEach(function(w){
            out.push({id: w[0], name: wardName(w[1]), low: fold(wardName(w[1])),
                      alt: fold(w[2] || ''), code: code, council: c.name,
                      div: /^E58/.test(w[0]), dea: /^N09/.test(code)});
          });
        });
        WLIST = out;
        if(q.value.trim().length >= 3) q.dispatchEvent(new Event('input'));
      }).catch(function(){ wlistLoading = false; });
    }
    q.addEventListener('focus', wardIndex);

    q.addEventListener('input', function(){
      var v = fold(q.value.trim());
      if(v.length < 2) return closeSugg();
      wardIndex();
      var pos = function(s){ return s.indexOf(v); };
      // councils first, then wards, both by where the match falls
      var hits = DATA.councils.filter(function(c){
        if(!inPlay(c)) return false;          // elections view: only councils voting
        return fold(c.name).indexOf(v) >= 0;
      }).sort(function(a,b){
        var ai = pos(fold(a.name)), bi = pos(fold(b.name));
        return ai !== bi ? ai - bi : a.name.localeCompare(b.name);
      });
      var whits = (WLIST && v.length >= 3) ? WLIST.filter(function(w){
        return w.low.indexOf(v) >= 0 || (w.alt && w.alt.indexOf(v) >= 0);
      }).sort(function(a,b){
        var ai = pos(a.low), bi = pos(b.low);
        return ai !== bi ? ai - bi : a.name.localeCompare(b.name) || a.council.localeCompare(b.council);
      }) : [];
      var nc = Math.min(hits.length, whits.length ? 4 : 8);
      hits = hits.slice(0, nc);
      whits = whits.slice(0, 8 - nc);
      if(!hits.length && !whits.length) return closeSugg();
      sg.innerHTML = hits.map(function(c){
        return '<div data-g="'+c.gss+'">'+c.name+' <span style="color:var(--faint)">'+
               (c.typeName||'')+'</span></div>';
      }).join('') + whits.map(function(w){
        return '<div data-g="'+w.code+'" data-w="'+esc(w.id)+'">'+esc(w.name)+
               ' <span style="color:var(--faint)">'+(w.dea ? 'Electoral area' : w.div ? 'Division' : 'Ward')+' \u00b7 '+esc(w.council)+'</span></div>';
      }).join('');
      sg.style.display = 'block';
      selIdx = 0; markSel();
      // mousedown, not click: blur would otherwise close the list first
      sg.querySelectorAll('div').forEach(function(el){
        el.addEventListener('mousedown', function(ev){ ev.preventDefault(); choose(el); });
      });
    });

    q.addEventListener('keydown', function(e){
      var items = sg.querySelectorAll('div');
      if(sg.style.display !== 'block' || !items.length){
        if(e.key === 'Escape') e.stopPropagation();
        return;
      }
      if(e.key === 'ArrowDown'){ e.preventDefault(); selIdx = (selIdx+1) % items.length; markSel(); }
      else if(e.key === 'ArrowUp'){ e.preventDefault(); selIdx = (selIdx-1+items.length) % items.length; markSel(); }
      else if(e.key === 'Enter'){ e.preventDefault(); choose(items[selIdx >= 0 ? selIdx : 0]); }
      else if(e.key === 'Escape'){ e.stopPropagation(); closeSugg(); }
    });
    q.addEventListener('blur', function(){ setTimeout(closeSugg, 180); });
    document.addEventListener('keydown', function(e){
      if(e.key === 'Escape'){
        if(WARD && WARD.pin){ WARD.pin = null; markWardPin(); return clearCard(); }
        if(WARD) return leaveWards();
        pinnedGss = null; markPinned(); clearCard();
        if(focusParty){
          focusParty = null;
          $('legend').querySelectorAll('.lgd').forEach(function(x){ x.classList.remove('off'); });
          $('tiles').querySelectorAll('.tot').forEach(function(x){ x.classList.remove('on'); });
          highlight(null);
        }
      }
    });
    // Only a change of width needs the maps redrawn. Phones change the height
    // as their toolbars slide in and out while scrolling, and redrawing then
    // would throw the reader out of the ward view.
    var lastW = window.innerWidth;
    window.addEventListener('resize', function(){
      if(window.innerWidth === lastW) return;
      lastW = window.innerWidth;
      clearTimeout(window.__ccrz);
      window.__ccrz = setTimeout(drawMaps, 250);
    });
  }

  // Search opens the council on whichever tier it is drawn on - switching
  // tier if it is only on the other one (a county from the lower tier, a
  // district from the upper) - in its ward view where it has one.
  // wardId: a ward picked in the search box - open its council's ward view,
  // then zoom to that ward and pin its card.
  function gotoCouncil(gss, wardId){
    var c = byGss[gss];
    if(!c || !inPlay(c)) return;
    var go = function(){
      var m = M[mapMode];
      if(WARD && WARD.code === gss && WARD.m === m && WARD.geo){
        if(wardId) focusWard(wardId);
        return;
      }
      if(c.wards && featureIn(m, gss)){
        enterWards(m, gss);
        if(WARD && wardId) WARD.focus = wardId;
      } else zoomTo(gss);
    };
    if(featureIn(M[mapMode], gss)) return go();
    setMapMode(mapMode === 'lower' ? 'upper' : 'lower').then(go);
  }
})();

// ------------------------------------------------------------- iframe fit --
// The Squarespace embed sizes its iframe from the height we post here. Without
// it the iframe is stuck at the fixed fallback in its style attribute: too tall
// on a wide screen, which leaves a band of empty page under the footer, and far
// too short on a phone, where the maps stack - the second map gets cut off
// mid-shape and the footer never appears at all. Since the iframe carries
// scrolling="no" there is then no way to reach what was clipped.
(function(){
  var last = 0, timer = null;

  // Measure the CONTENT, never the document. documentElement.scrollHeight is
  // floored at the viewport, so once the parent has sized the iframe to fit,
  // it reports the frame's own height back - and each round trip adds the
  // parent's padding again, growing the frame forever. #cc-app's bottom edge
  // is the real end of the widget (#cc-tip lives outside it but is fixed, so
  // it never contributes).
  function measure(){
    var app = document.getElementById('cc-app');
    if(!app) return 0;
    var mb = parseFloat(getComputedStyle(document.body).marginBottom) || 0;
    return Math.ceil(app.getBoundingClientRect().bottom + (window.scrollY || 0) + mb);
  }

  function send(){
    var h = measure();
    if(!h || Math.abs(h - last) < 2) return;   // also stops any resize ping-pong
    last = h;
    try{ parent.postMessage({councilMapHeight: h}, '*'); }catch(e){}
  }

  function ping(){ clearTimeout(timer); timer = setTimeout(send, 60); }

  window.addEventListener('load', ping);
  window.addEventListener('resize', ping);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(ping);
  // Catches everything that changes height from inside: the data arriving, the
  // tier toggle refitting the maps, the tables opening, a card rendering.
  if(window.ResizeObserver){
    var ro = new ResizeObserver(ping);
    ro.observe(document.documentElement);
    if(document.body) ro.observe(document.body);
  }
  [150, 600, 1500, 3000].forEach(function(t){ setTimeout(ping, t); });
  ping();
})();
</script>
</body>
