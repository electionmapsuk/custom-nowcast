<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UK Council Control</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  :root{
    --bg:#f7f7f5; --panel:#fff; --ink:#15171a; --muted:#6b7280; --faint:#9ca3af;
    --line:#e3e3df; --line2:#eeeeea; --accent:#004d4d; --radius:10px;
  }
  #cc-app *{box-sizing:border-box;}
  #cc-app{font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased;
    color:var(--ink); background:transparent; max-width:1120px; margin:0 auto; padding:8px 4px 40px;}

  .masthead{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:14px;}
  .masthead h1{font-size:1.55rem; font-weight:900; letter-spacing:-0.03em; margin:0;}
  .modepill{font-size:.7rem; font-weight:800; text-transform:uppercase; letter-spacing:.06em;
    padding:6px 11px; border-radius:7px; background:#eef2f2; color:var(--accent); white-space:nowrap;}

  .section-h{font-size:.72rem; text-transform:uppercase; letter-spacing:.09em; color:var(--faint);
    font-weight:700; margin:26px 0 12px;}
  .panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:18px;}

  /* summary tiles */
  .totstrip{display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:8px;}
  @media(max-width:820px){ .totstrip{grid-template-columns:repeat(3,minmax(0,1fr));} }
  @media(max-width:460px){ .totstrip{grid-template-columns:repeat(2,minmax(0,1fr));} }
  .tot{border-radius:8px; padding:11px 12px; cursor:pointer; border:2px solid transparent; transition:transform .12s;}
  .tot:hover{transform:translateY(-2px);}
  .tot.on{border-color:#15171a;}
  .tot .nm{font-size:.7rem; font-weight:800; text-transform:uppercase; opacity:.92; margin-bottom:1px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tot .n{font-size:1.7rem; font-weight:900; line-height:1; font-variant-numeric:tabular-nums;}
  .tot .sub{font-size:.68rem; font-weight:700; opacity:.85; margin-top:3px; font-variant-numeric:tabular-nums;}

  /* national seat bar */
  .seatbar{height:34px; border-radius:7px; overflow:hidden; display:flex; margin:14px 0 8px; background:var(--line2);}
  .seatbar .seg{height:100%;}
  .barkey{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:.74rem; color:var(--muted); font-weight:600;}
  .barkey i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px;}

  /* controls */
  .toolbar{display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; align-items:center;}
  .mmb{padding:7px 13px; border-radius:7px; border:1px solid var(--line); background:#fff; font-weight:700;
    font-size:.78rem; color:var(--muted); cursor:pointer; font-family:inherit;}
  .mmb:hover{border-color:var(--accent); color:var(--accent);}
  .mmb.active{background:var(--accent); color:#fff; border-color:var(--accent);}
  .spacer{flex:1;}
  .search{position:relative;}
  .search input{border:1px solid var(--line); border-radius:7px; padding:7px 11px; font-family:inherit;
    font-size:.8rem; width:190px; color:var(--ink); background:#fff;}
  .search input:focus{outline:none; border-color:var(--accent);}
  .sugg{position:absolute; z-index:40; top:calc(100% + 4px); left:0; width:260px; background:#fff;
    border:1px solid var(--line); border-radius:8px; box-shadow:0 10px 26px rgba(0,0,0,.13); overflow:hidden; display:none;}
  .sugg div{padding:7px 11px; font-size:.8rem; cursor:pointer;}
  .sugg div:hover, .sugg div.sel{background:#eef2f2; color:var(--accent);}

  .mapgrid{display:grid; grid-template-columns:minmax(0,1fr) 360px; gap:16px; align-items:start;}
  @media(max-width:900px){ .mapgrid{grid-template-columns:1fr;} }
  /* the UK is roughly twice as tall as it is wide, so cap the map's width to
     stop it swimming in a wide column */
  #map-container{position:relative; width:100%; max-width:560px; margin:0 auto; height:640px;
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}
  @media(max-width:900px){ #map-container{height:520px; max-width:none;} }

  /* side panel - the same card the tooltip renders, pinned in place */
  #detail{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    overflow:hidden; min-height:260px; position:sticky; top:12px;}
  @media(max-width:900px){ #detail{display:none;} }
  #detail .empty{padding:20px;}
  #detail .empty h3{margin:0 0 4px; font-size:.95rem; font-weight:800;}
  #detail .empty p{margin:0 0 16px; font-size:.8rem; color:var(--muted); line-height:1.5;}
  #detail .ctrlrow{display:grid; grid-template-columns:1fr 34px; align-items:center; gap:8px;
    font-size:.78rem; font-weight:700; padding:5px 0; border-top:1px solid var(--line2);}
  #detail .ctrlrow i{display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:7px; vertical-align:-1px;}
  #detail .ctrlrow b{text-align:right; font-variant-numeric:tabular-nums;}
  #map-container svg{cursor:grab; display:block;} #map-container svg:active{cursor:grabbing;}
  .cp{stroke:#fff; stroke-width:.3px; cursor:pointer; transition:fill-opacity .15s;}
  .cp:hover{stroke:#15171a; stroke-width:1.1px;}
  .cp.pinned{stroke:#15171a; stroke-width:1.4px;}
  .cp.dim{fill-opacity:.16;}
  .map-hint{position:absolute; left:14px; bottom:12px; font-size:.72rem; color:var(--faint);
    background:rgba(255,255,255,.85); padding:4px 9px; border-radius:8px; pointer-events:none;}
  .map-reset{position:absolute; right:12px; top:12px; padding:5px 11px; border-radius:7px;
    border:1px solid var(--line); background:rgba(255,255,255,.92); font-weight:700; font-size:.74rem;
    color:var(--muted); cursor:pointer; font-family:inherit;}
  .map-reset:hover{border-color:var(--accent); color:var(--accent);}
  .loading{padding:80px 20px; text-align:center; color:var(--muted); font-weight:600;}

  /* legend */
  .legend{display:flex; flex-wrap:wrap; gap:7px; margin-top:12px;}
  .lgd{display:flex; align-items:center; gap:6px; font-size:.74rem; font-weight:700; color:var(--muted);
    border:1px solid var(--line); background:#fff; border-radius:7px; padding:5px 9px; cursor:pointer;}
  .lgd:hover{border-color:var(--accent); color:var(--accent);}
  .lgd.off{opacity:.4;}
  .lgd i{width:13px; height:13px; border-radius:3px; flex:none;}
  .lgd b{color:var(--ink); font-variant-numeric:tabular-nums;}

  /* card - used by both the floating tooltip and the side panel */
  #cc-tip{position:fixed; pointer-events:none; z-index:60; width:252px; display:none; border-radius:12px;
    overflow:hidden; box-shadow:0 12px 32px rgba(0,0,0,.2); background:#fff;
    font-family:'Inter',system-ui,sans-serif;}
  .ccard .hd{background:#0b3d3d; color:#fff; padding:11px 12px 10px;}
  .ccard .hd .nm{font-size:1.1rem; font-weight:800; line-height:1.12; letter-spacing:-0.01em;}
  .ccard .hd .ty{font-size:.68rem; opacity:.8; font-weight:600; margin-top:2px;}
  .ccard .hd .res{display:flex; gap:4px; margin:9px 0 7px; height:26px;}
  .ccard .hd .pill{flex:1; border-radius:6px; display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:.8rem; padding:0 6px; text-align:center;}
  .ccard .hd .meta{font-size:.71rem; opacity:.92; line-height:1.45;}
  .ccard .hd .meta b{font-weight:800;}
  .ccard .stack{display:flex; height:9px; background:#0b3d3d;}
  .ccard .stack i{height:100%;}
  .ccard .bd{padding:9px 12px 6px;}
  #cc-tip .bd{max-height:236px; overflow:hidden;}
  .ccard .r{display:grid; grid-template-columns:34px 1fr 30px; align-items:center; gap:6px; margin-bottom:4px;}
  .ccard .r .ab{font-size:.63rem; font-weight:800; text-align:center; padding:2px 0; border-radius:4px;}
  .ccard .r .bar{position:relative; height:16px; background:#eee; border-radius:4px; overflow:hidden;}
  .ccard .r .bar i{position:absolute; left:0; top:0; height:100%; border-radius:4px;}
  .ccard .r .bar span{position:absolute; top:0; height:100%; display:flex; align-items:center;
    font-size:.66rem; font-weight:700; white-space:nowrap; overflow:hidden; right:4px;}
  .ccard .r .bar span.inside{left:7px; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.45);}
  .ccard .r .bar span.outside{color:var(--muted);}
  .ccard .r .n{font-size:.75rem; font-weight:800; text-align:right; font-variant-numeric:tabular-nums;}
  .ccard .ft{text-align:center; padding:6px; color:var(--accent); font-weight:800; font-size:.7rem;
    border-top:1px solid var(--line2);}

  /* table */
  .table-wrap{display:none; border:1px solid var(--line); border-radius:var(--radius); overflow:auto; max-height:560px;}
  #cc-app table{width:100%; border-collapse:collapse; font-size:.8rem;}
  #cc-app th, #cc-app td{padding:8px 10px; text-align:left; border-bottom:1px solid var(--line2); white-space:nowrap;}
  #cc-app th{position:sticky; top:0; background:#fbfbfa; font-size:.66rem; text-transform:uppercase;
    letter-spacing:.05em; color:var(--faint); cursor:pointer; z-index:2;}
  #cc-app th:hover{color:var(--accent);}
  #cc-app td.ctrl{color:#fff; font-weight:800; text-align:center; border-radius:0;}
  #cc-app td.num{text-align:right; font-variant-numeric:tabular-nums; color:var(--muted);}
  #cc-app tbody tr:hover{background:#fbf7f4;}

  .foot{margin-top:22px; font-size:.74rem; color:var(--faint); line-height:1.6;}
  .foot a{color:var(--accent); font-weight:700; text-decoration:none;}
  .foot a:hover{text-decoration:underline;}
</style>
</head>
<body>
<div id="cc-app">
  <div class="masthead">
    <h1>Who runs Britain's councils</h1>
    <span class="modepill" id="stamp">Loading…</span>
  </div>

  <div id="loading" class="loading">Loading council data…</div>

  <div id="app" style="display:none;">
    <div class="panel">
      <div class="section-h" style="margin:0 0 12px;">Councils controlled</div>
      <div class="totstrip" id="tiles"></div>
      <div class="section-h" style="margin:22px 0 0;">Councillors across the UK</div>
      <div class="seatbar" id="natbar"></div>
      <div class="barkey" id="natkey"></div>
    </div>

    <div class="section-h">The map</div>
    <div class="toolbar">
      <button class="mmb active" data-tier="lower">Districts &amp; unitaries</button>
      <button class="mmb" data-tier="upper">Counties &amp; unitaries</button>
      <span style="width:10px;"></span>
      <button class="mmb active" data-colour="control">Colour: control</button>
      <button class="mmb" data-colour="largest">Colour: largest party</button>
      <span class="spacer"></span>
      <div class="search">
        <input id="q" type="text" placeholder="Find a council…" autocomplete="off">
        <div class="sugg" id="sugg"></div>
      </div>
    </div>

    <div class="mapgrid">
      <div>
        <div id="map-container">
          <div class="map-hint">Scroll to zoom · drag to pan · click to pin</div>
          <button class="map-reset" id="reset">Reset view</button>
        </div>
        <div class="legend" id="legend"></div>
      </div>
      <div id="detail" class="ccard"></div>
    </div>

    <div class="toolbar" style="margin-top:26px;">
      <button class="mmb" id="tabletog">Show full table</button>
      <button class="mmb" id="csvbtn">Download CSV</button>
      <span class="spacer"></span>
      <span style="font-size:.74rem; color:var(--faint); font-weight:600;" id="counts"></span>
    </div>
    <div class="table-wrap" id="tablewrap"><table id="tbl"></table></div>

    <div class="foot" id="foot"></div>
  </div>
</div>
<div id="cc-tip"></div>

<script>
(function(){
  // ---------------------------------------------------------------- config --
  // Served from GitHub Pages next to this file; falls back to raw.githubusercontent
  // so the widget also works if it is opened from somewhere else.
  var DATA_BASE = 'data/';
  var DATA_FALLBACK = 'https://raw.githubusercontent.com/electionmapsuk/custom-nowcast/refs/heads/main/councils/data/';

  var $ = function(id){ return document.getElementById(id); };
  var tip = $('cc-tip');

  var DATA = null, GEO = {}, tier = 'lower', colourMode = 'control';
  var byGss = {}, focusParty = null, pinned = null;
  var svg = null, mapG = null, zoomB = null, path = null, drawnTier = null;
  var sortKey = 'name', sortDir = 1;

  function txtOn(c){
    var h=(c||'#888').replace('#','');
    if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    var r=parseInt(h.slice(0,2),16), g=parseInt(h.slice(2,4),16), b=parseInt(h.slice(4,6),16);
    return (0.299*r+0.587*g+0.114*b)/255 > 0.62 ? '#15171a' : '#fff';
  }
  function pInfo(code){
    var p = DATA && DATA.parties[code];
    return p || {name: code || 'Other', colour:'#9ca3af'};
  }
  function abbrev(code){
    var m = {LAB:'Lab',CON:'Con',LDM:'LD',RFM:'Ref',GRN:'Grn',SNP:'SNP',PLC:'PC',IND:'Ind',
             OTH:'Oth',UKI:'UKIP',VAC:'Vac',SF:'SF',DUP:'DUP',ALL:'All',UUP:'UUP',SDLP:'SDLP',TUV:'TUV'};
    return m[code] || code;
  }
  function fmt(n){ return (n||0).toLocaleString('en-GB'); }

  // ------------------------------------------------------------- colouring --
  // Majority control gets a solid fill; a minority or coalition administration
  // gets the same colour as diagonal stripes; genuine NOC is grey.
  function fillFor(c){
    if(!c) return '#efefec';
    if(colourMode === 'largest'){
      if(!c.largest || c.largestTied) return DATA.nocColour;
      return pInfo(c.largest).colour;
    }
    var ct = c.control;
    if(!ct || ct.type === 'noc' || !ct.parties.length) return DATA.nocColour;
    var col = pInfo(ct.parties[0]).colour;
    if(ct.type === 'majority') return col;
    return 'url(#hatch-' + ct.parties[0] + ')';
  }
  function swatchFor(c){
    if(colourMode === 'largest'){
      return (!c.largest || c.largestTied) ? DATA.nocColour : pInfo(c.largest).colour;
    }
    var ct = c.control;
    if(!ct || ct.type === 'noc' || !ct.parties.length) return DATA.nocColour;
    return pInfo(ct.parties[0]).colour;
  }
  function controlText(c){
    var ct = c.control;
    if(!ct || ct.type === 'noc' || !ct.parties.length){
      return (ct && ct.label === 'TBC') ? 'Administration to be confirmed' : 'No overall control';
    }
    var names = ct.parties.map(function(p){ return pInfo(p).name; }).join(' + ');
    if(ct.type === 'mayoral')   return names + ' mayor';
    if(ct.type === 'majority')  return names + ' majority';
    if(ct.type === 'minority')  return names + ' minority';
    return names + ' coalition';
  }

  // ------------------------------------------------------------------ load --
  function loadJson(name){
    return fetch(DATA_BASE + name)
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .catch(function(){
        DATA_BASE = DATA_FALLBACK;
        return fetch(DATA_FALLBACK + name).then(function(r){
          if(!r.ok) throw new Error('HTTP ' + r.status); return r.json();
        });
      });
  }

  Promise.all([loadJson('councils.json'), loadJson('boundaries-lower.json')]).then(function(a){
    DATA = a[0]; GEO.lower = a[1];
    DATA.councils.forEach(function(c){ if(c.gss) byGss[c.gss] = c; });
    start();
  }).catch(function(e){
    $('loading').textContent = 'Could not load council data (' + e.message + ').';
  });

  function start(){
    $('loading').style.display = 'none';
    $('app').style.display = 'block';
    var d = new Date(DATA.meta.generated);
    $('stamp').textContent = 'Updated ' + d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
    buildTiles(); buildNatBar(); buildFoot(); panelDefault(); wire(); drawMap(); buildLegend(); buildTable();
  }

  // ----------------------------------------------------------------- tiles --
  function buildTiles(){
    var ct = DATA.meta.controlTotals || {};
    var entries = Object.keys(ct).filter(function(k){ return k !== 'NOC'; })
      .map(function(k){ return [k, ct[k]]; })
      .sort(function(a,b){ return b[1]-a[1]; }).slice(0,5);
    entries.push(['NOC', ct.NOC || 0]);

    var html = entries.map(function(e){
      var code = e[0];
      var col  = code === 'NOC' ? DATA.nocColour : pInfo(code).colour;
      var name = code === 'NOC' ? 'No overall control' : pInfo(code).name;
      var seats = code === 'NOC' ? null : (DATA.meta.partyTotals[code] || 0);
      return '<div class="tot" data-p="'+code+'" style="background:'+col+'; color:'+txtOn(col)+'">' +
        '<div class="nm">'+name+'</div>' +
        '<div class="n">'+fmt(e[1])+'</div>' +
        '<div class="sub">'+(seats===null ? 'of '+fmt(DATA.meta.councils)+' councils' : fmt(seats)+' councillors')+'</div>' +
        '</div>';
    }).join('');
    $('tiles').innerHTML = html;
    $('tiles').querySelectorAll('.tot').forEach(function(el){
      el.addEventListener('click', function(){
        var p = el.getAttribute('data-p');
        focusParty = (focusParty === p) ? null : p;
        $('tiles').querySelectorAll('.tot').forEach(function(x){
          x.classList.toggle('on', x.getAttribute('data-p') === focusParty);
        });
        $('legend').querySelectorAll('.lgd').forEach(function(x){
          x.classList.toggle('off', !!focusParty && x.getAttribute('data-k') !== focusParty);
        });
        highlight(focusParty);
      });
    });
  }

  // Dim every council that is not controlled by (or largest party in) `code`.
  function highlight(code){
    if(!mapG) return;
    mapG.selectAll('.cp').classed('dim', function(d){
      if(!code) return false;
      var c = byGss[d.properties.code];
      if(!c) return true;
      if(code === 'NOC'){
        return !(c.control.type === 'noc' || !c.control.parties.length ||
                 c.control.type === 'minority' || c.control.type === 'coalition');
      }
      return !(c.control.type === 'majority' && c.control.parties[0] === code);
    });
  }

  // -------------------------------------------------------------- nat. bar --
  function buildNatBar(){
    var tot = DATA.meta.partyTotals || {};
    var order = DATA.spectrum.filter(function(p){ return tot[p]; });
    var sum = order.reduce(function(a,p){ return a + tot[p]; }, 0);
    $('natbar').innerHTML = order.map(function(p){
      return '<div class="seg" title="'+pInfo(p).name+' '+fmt(tot[p])+'" style="width:'+
        (100*tot[p]/sum)+'%; background:'+pInfo(p).colour+'"></div>';
    }).join('');
    $('natkey').innerHTML = order.filter(function(p){ return tot[p]/sum > 0.012; })
      .sort(function(a,b){ return tot[b]-tot[a]; })
      .map(function(p){
        return '<span><i style="background:'+pInfo(p).colour+'"></i>'+pInfo(p).name+
               ' <b style="color:var(--ink)">'+fmt(tot[p])+'</b></span>';
      }).join('');
  }

  function buildFoot(){
    $('foot').innerHTML =
      'Source: <a href="https://opencouncildata.co.uk/" target="_blank" rel="noopener">Open Council Data UK</a>' +
      ' — councillor data CC0, compositions CC BY-SA 4.0. Boundaries: Office for National Statistics ' +
      'licensed under the Open Government Licence v3.0; contains OS data © Crown copyright and database right. ' +
      '<br>Control labels are Open Council Data\'s own. Solid fill = outright majority; ' +
      'striped = minority or coalition administration; grey = no overall control. ' +
      'Refreshed automatically every Monday.' + notShownNote();
    $('counts').textContent = fmt(DATA.meta.councils) + ' councils · ' +
      fmt(DATA.meta.councillors) + ' councillors' +
      (DATA.meta.vacancies ? ' · ' + fmt(DATA.meta.vacancies) + ' vacant seats' : '');
  }

  function notShownNote(){
    var ns = (DATA.meta && DATA.meta.notShown) || [];
    if(!ns.length) return '';
    return '<br>Listed by Open Council Data but not mapped (no published boundary yet): ' +
           ns.map(function(x){ return x.name; }).join(', ') + '.';
  }

  // ------------------------------------------------------------------- map --
  function tierGeo(cb){
    if(GEO[tier]) return cb(GEO[tier]);
    loadJson('boundaries-' + tier + '.json').then(function(g){
      GEO[tier] = g; cb(g);
    }).catch(function(e){ console.error('boundary layer unavailable', e); });
  }

  function drawMap(){
    tierGeo(function(g){
      if(drawnTier === tier) { recolour(); return; }
      drawnTier = tier;
      var cont = d3.select('#map-container');
      cont.select('svg').remove();
      var box = $('map-container').getBoundingClientRect();
      var w = Math.max(320, box.width), h = Math.max(320, box.height);

      svg = cont.append('svg').attr('width','100%').attr('height',h)
        .attr('viewBox','0 0 '+w+' '+h)
        .attr('role','img')
        .attr('aria-label','Map of UK councils coloured by political control. The same data is available in the table below.');

      // striped fills for minority / coalition administrations
      var defs = svg.append('defs');
      Object.keys(DATA.parties).forEach(function(code){
        var col = DATA.parties[code].colour;
        var p = defs.append('pattern').attr('id','hatch-'+code)
          .attr('width',5).attr('height',5).attr('patternUnits','userSpaceOnUse')
          .attr('patternTransform','rotate(45)');
        p.append('rect').attr('width',5).attr('height',5).attr('fill','#fff');
        p.append('rect').attr('width',3).attr('height',5).attr('fill',col);
      });

      mapG = svg.append('g');
      var proj = d3.geoMercator().fitExtent([[14,14],[w-14,h-14]], g);
      path = d3.geoPath().projection(proj);

      mapG.selectAll('path.cp').data(g.features).enter().append('path')
        .attr('class','cp').attr('d', path)
        .on('mousemove', function(e,d){ if(!pinned) showTip(e,d); })
        .on('mouseleave', function(){ if(!pinned) clearCard(); })
        .on('click', function(e,d){
          var same = pinned && pinned === d;
          mapG.selectAll('.cp').classed('pinned', false);
          if(same){ pinned = null; clearCard(); }
          else { pinned = d; d3.select(this).classed('pinned', true); showCard(e,d); }
        });

      zoomB = d3.zoom().scaleExtent([1,50]).on('zoom', function(e){
        mapG.attr('transform', e.transform);
        mapG.attr('stroke-width', 0.3/Math.sqrt(e.transform.k));
        if(!pinned && !panelOn()) tip.style.display='none';
      });
      svg.call(zoomB);
      recolour();
    });
  }

  function recolour(){
    if(!mapG) return;
    mapG.selectAll('.cp').attr('fill', function(d){ return fillFor(byGss[d.properties.code]); });
    buildLegend();
    highlight(focusParty);
  }

  // The same card is used by the floating tooltip (narrow screens) and by the
  // side panel (wide screens).
  function cardHtml(c, fallbackName){
    if(!c){
      return '<div class="hd"><div class="nm">'+(fallbackName||'Unknown')+'</div>' +
             '<div class="ty">No council data</div></div>';
    }
    var seats = c.seats, order = DATA.spectrum.filter(function(p){ return seats[p]; });
    var contested = order.filter(function(p){ return p !== 'VAC'; });
    var max = Math.max.apply(null, contested.map(function(p){ return seats[p]; }).concat([1]));
    var col = swatchFor(c);
    var maj = Math.floor(c.total/2) + 1;

    var stack = order.map(function(p){
      return '<i style="width:'+(100*seats[p]/c.total)+'%; background:'+pInfo(p).colour+'"></i>';
    }).join('');

    var rows = order.map(function(p){
      var pc = pInfo(p), pct = 100*seats[p]/max;
      var inside = pct >= 46;   // short bars get their label outside, in dark ink
      return '<div class="r">' +
        '<div class="ab" style="background:'+pc.colour+'; color:'+txtOn(pc.colour)+'">'+abbrev(p)+'</div>' +
        '<div class="bar"><i style="width:'+pct+'%; background:'+pc.colour+'"></i>' +
        '<span class="'+(inside?'inside':'outside')+'"'+
          (inside ? '' : ' style="left:calc('+pct+'% + 6px)"')+'>'+pc.name+'</span></div>' +
        '<div class="n">'+seats[p]+'</div></div>';
    }).join('');

    return '<div class="hd">' +
        '<div class="nm">'+c.name+'</div>' +
        '<div class="ty">'+(c.typeName||'')+(c.nation && c.nation!=='England' ? ' · '+c.nation : '')+'</div>' +
        '<div class="res"><div class="pill" style="background:'+col+'; color:'+txtOn(col)+'">'+
          controlText(c)+'</div></div>' +
        '<div class="meta"><b>'+c.total+'</b> seats · <b>'+maj+'</b> for a majority'+
          (c.vacant ? ' · <b>'+c.vacant+'</b> vacant' : '')+'</div>' +
      '</div>' +
      '<div class="stack">'+stack+'</div>' +
      '<div class="bd">'+rows+'</div>' +
      (c.nextElection ? '<div class="ft">Next election '+
        new Date(c.nextElection).toLocaleDateString('en-GB',{month:'short',year:'numeric'})+'</div>' : '');
  }

  function panelOn(){ return window.innerWidth > 900; }

  function panelDefault(){
    var ct = DATA.meta.controlTotals || {};
    var keys = Object.keys(ct).filter(function(k){ return k !== 'NOC'; })
      .sort(function(a,b){ return ct[b]-ct[a]; });
    if(ct.NOC) keys.push('NOC');
    var rows = keys.map(function(k){
      var col = k==='NOC' ? DATA.nocColour : pInfo(k).colour;
      var nm  = k==='NOC' ? 'No overall control' : pInfo(k).name;
      return '<div class="ctrlrow"><span><i style="background:'+col+'"></i>'+nm+'</span>' +
             '<b>'+ct[k]+'</b></div>';
    }).join('');
    $('detail').innerHTML =
      '<div class="empty"><h3>Councils by control</h3>' +
      '<p>Hover a council on the map for its full party breakdown. Click to keep it open.</p>' +
      rows + '</div>';
  }

  function showCard(e, d){
    var c = byGss[d.properties.code];
    var html = cardHtml(c, d.properties.name);
    if(panelOn()){
      $('detail').innerHTML = html;
      tip.style.display = 'none';
    } else {
      tip.innerHTML = html;
      place(e);
    }
  }

  function clearCard(){
    tip.style.display = 'none';
    if(panelOn()){
      if(pinned) showCard(null, pinned); else panelDefault();
    }
  }

  function showTip(e, d){ showCard(e, d); }

  function place(e){
    tip.style.display = 'block';
    var r = tip.getBoundingClientRect();
    var x = e.clientX + 16, y = e.clientY + 16;
    if(x + r.width  > window.innerWidth  - 8) x = e.clientX - r.width  - 16;
    if(y + r.height > window.innerHeight - 8) y = Math.max(8, window.innerHeight - r.height - 8);
    tip.style.left = x + 'px';
    tip.style.top  = y + 'px';
  }

  // ---------------------------------------------------------------- legend --
  function buildLegend(){
    if(!DATA) return;
    var counts = {}, layer = GEO[tier];
    if(!layer) return;
    layer.features.forEach(function(f){
      var c = byGss[f.properties.code];
      if(!c) return;
      var key;
      if(colourMode === 'largest') key = (!c.largest || c.largestTied) ? 'NOC' : c.largest;
      else key = (c.control.type === 'majority') ? c.control.parties[0] : 'NOC';
      counts[key] = (counts[key]||0) + 1;
    });
    var keys = Object.keys(counts).filter(function(k){ return k!=='NOC'; })
      .sort(function(a,b){ return counts[b]-counts[a]; });
    if(counts.NOC) keys.push('NOC');
    $('legend').innerHTML = keys.map(function(k){
      var col = k==='NOC' ? DATA.nocColour : pInfo(k).colour;
      var nm  = k==='NOC' ? (colourMode==='largest' ? 'No single largest' : 'No overall control') : pInfo(k).name;
      return '<span class="lgd" data-k="'+k+'"><i style="background:'+col+'"></i>'+nm+
             ' <b>'+counts[k]+'</b></span>';
    }).join('');
    $('legend').querySelectorAll('.lgd').forEach(function(el){
      el.addEventListener('click', function(){
        var k = el.getAttribute('data-k');
        var turnOff = (focusParty === k);
        focusParty = turnOff ? null : k;
        $('legend').querySelectorAll('.lgd').forEach(function(x){
          x.classList.toggle('off', !!focusParty && x.getAttribute('data-k') !== focusParty);
        });
        $('tiles').querySelectorAll('.tot').forEach(function(x){
          x.classList.toggle('on', !!focusParty && x.getAttribute('data-p') === focusParty);
        });
        highlight(focusParty);
      });
    });
    if(focusParty && !counts[focusParty]) focusParty = null;
  }

  // ----------------------------------------------------------------- table --
  function tableRows(){
    var layer = GEO[tier];
    var list = DATA.councils.filter(function(c){
      return c.tier === 'both' || c.tier === tier;
    });
    var dir = sortDir;
    list.sort(function(a,b){
      var x, y;
      if(sortKey === 'name'){ x=a.name; y=b.name; return dir * (x<y?-1:x>y?1:0); }
      if(sortKey === 'type'){ x=a.typeName||''; y=b.typeName||''; return dir * (x<y?-1:x>y?1:0); }
      if(sortKey === 'control'){ x=controlText(a); y=controlText(b); return dir * (x<y?-1:x>y?1:0); }
      if(sortKey === 'total'){ return dir * (a.total-b.total); }
      return dir * ((a.seats[sortKey]||0) - (b.seats[sortKey]||0));
    });
    return list;
  }

  function buildTable(){
    var cols = DATA.spectrum.filter(function(p){
      return DATA.meta.partyTotals[p];
    });
    var head = '<thead><tr>' +
      '<th data-k="name">Council</th><th data-k="type">Type</th>' +
      '<th data-k="control">Control</th>' +
      cols.map(function(p){ return '<th data-k="'+p+'" title="'+pInfo(p).name+'">'+abbrev(p)+'</th>'; }).join('') +
      '<th data-k="total">Total</th></tr></thead>';
    var body = '<tbody>' + tableRows().map(function(c){
      var col = swatchFor(c);
      return '<tr><td>'+c.name+'</td><td style="color:var(--muted)">'+(c.typeName||'')+'</td>' +
        '<td class="ctrl" style="background:'+col+'; color:'+txtOn(col)+'">'+
        (c.control.label==='NOC' ? 'NOC' : c.control.label)+'</td>' +
        cols.map(function(p){ return '<td class="num">'+(c.seats[p]||'')+'</td>'; }).join('') +
        '<td class="num" style="color:var(--ink); font-weight:700">'+c.total+'</td></tr>';
    }).join('') + '</tbody>';
    $('tbl').innerHTML = head + body;
    $('tbl').querySelectorAll('th').forEach(function(th){
      th.addEventListener('click', function(){
        var k = th.getAttribute('data-k');
        if(sortKey === k) sortDir = -sortDir;
        else { sortKey = k; sortDir = (k==='name'||k==='type'||k==='control') ? 1 : -1; }
        buildTable();
      });
    });
  }

  function downloadCsv(){
    var cols = DATA.spectrum.filter(function(p){ return DATA.meta.partyTotals[p]; });
    var head = ['Council','Type','Nation','Region','GSS','Control','ControlType']
      .concat(cols.map(function(p){ return pInfo(p).name; })).concat(['Total']);
    var lines = [head.join(',')];
    tableRows().forEach(function(c){
      var row = ['"'+c.name.replace(/"/g,'""')+'"', '"'+(c.typeName||'')+'"', c.nation, '"'+(c.region||'')+'"',
                 c.gss, '"'+c.control.label+'"', c.control.type]
        .concat(cols.map(function(p){ return c.seats[p]||0; })).concat([c.total]);
      lines.push(row.join(','));
    });
    var blob = new Blob([lines.join('\n')], {type:'text/csv;charset=utf-8'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'uk-council-control-' + DATA.meta.generated.slice(0,10) + '.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
  }

  // ------------------------------------------------------------------ wire --
  function wire(){
    document.querySelectorAll('[data-tier]').forEach(function(b){
      b.addEventListener('click', function(){
        if(tier === b.getAttribute('data-tier')) return;
        document.querySelectorAll('[data-tier]').forEach(function(x){ x.classList.remove('active'); });
        b.classList.add('active');
        tier = b.getAttribute('data-tier');
        pinned = null; clearCard();
        drawMap(); buildTable();
      });
    });
    document.querySelectorAll('[data-colour]').forEach(function(b){
      b.addEventListener('click', function(){
        document.querySelectorAll('[data-colour]').forEach(function(x){ x.classList.remove('active'); });
        b.classList.add('active');
        colourMode = b.getAttribute('data-colour');
        recolour(); buildTable();
      });
    });
    $('reset').addEventListener('click', function(){
      if(svg && zoomB) svg.transition().duration(500).call(zoomB.transform, d3.zoomIdentity);
      pinned = null;
      if(mapG) mapG.selectAll('.cp').classed('pinned', false);
      clearCard();
    });
    $('tabletog').addEventListener('click', function(){
      var w = $('tablewrap');
      var open = w.style.display === 'block';
      w.style.display = open ? 'none' : 'block';
      $('tabletog').textContent = open ? 'Show full table' : 'Hide table';
      $('tabletog').classList.toggle('active', !open);
    });
    $('csvbtn').addEventListener('click', downloadCsv);

    // search
    var q = $('q'), sg = $('sugg');
    q.addEventListener('input', function(){
      var v = q.value.trim().toLowerCase();
      if(v.length < 2){ sg.style.display='none'; return; }
      var hits = DATA.councils.filter(function(c){
        return c.name.toLowerCase().indexOf(v) >= 0;
      }).slice(0,8);
      if(!hits.length){ sg.style.display='none'; return; }
      sg.innerHTML = hits.map(function(c){
        return '<div data-g="'+c.gss+'">'+c.name+' <span style="color:var(--faint)">'+
               (c.typeName||'')+'</span></div>';
      }).join('');
      sg.style.display = 'block';
      sg.querySelectorAll('div').forEach(function(el){
        el.addEventListener('click', function(){
          gotoCouncil(el.getAttribute('data-g'));
          sg.style.display='none'; q.value='';
        });
      });
    });
    q.addEventListener('blur', function(){ setTimeout(function(){ sg.style.display='none'; }, 180); });
    document.addEventListener('keydown', function(e){
      if(e.key === 'Escape'){
        pinned = null;
        if(mapG) mapG.selectAll('.cp').classed('pinned', false);
        clearCard();
        if(focusParty){
          focusParty = null;
          $('legend').querySelectorAll('.lgd').forEach(function(x){ x.classList.remove('off'); });
          $('tiles').querySelectorAll('.tot').forEach(function(x){ x.classList.remove('on'); });
          highlight(null);
        }
      }
    });
    window.addEventListener('resize', function(){
      clearTimeout(window.__ccrz);
      window.__ccrz = setTimeout(function(){ drawnTier = null; drawMap(); }, 250);
    });
  }

  function gotoCouncil(gss){
    var c = byGss[gss];
    if(!c) return;
    // switch tier if this council is not on the current layer
    if(c.tier !== 'both' && c.tier !== tier){
      var btn = document.querySelector('[data-tier="'+c.tier+'"]');
      if(btn) btn.click();
      setTimeout(function(){ zoomTo(gss); }, 400);
      return;
    }
    zoomTo(gss);
  }

  // Tell a parent page (the Squarespace embed) how tall we are.
  var lastH = 0;
  function reportHeight(){
    var h = Math.ceil(document.documentElement.getBoundingClientRect().height);
    if(Math.abs(h - lastH) > 8 && window.parent !== window){
      lastH = h;
      window.parent.postMessage({councilMapHeight: h, nowcastHeight: h}, '*');
    }
  }
  setInterval(reportHeight, 600);
  window.addEventListener('load', reportHeight);

  function zoomTo(gss){
    if(!mapG || !path) return;
    var node = null;
    mapG.selectAll('.cp').each(function(d){ if(d.properties.code === gss) node = {el:this, d:d}; });
    if(!node) return;
    var b = path.bounds(node.d);
    var box = $('map-container').getBoundingClientRect();
    var W = box.width, H = box.height;
    var dx = b[1][0]-b[0][0], dy = b[1][1]-b[0][1];
    var k = Math.max(1, Math.min(40, 0.55/Math.max(dx/W, dy/H)));
    var cx = (b[0][0]+b[1][0])/2, cy = (b[0][1]+b[1][1])/2;
    svg.transition().duration(700).call(zoomB.transform,
      d3.zoomIdentity.translate(W/2 - k*cx, H/2 - k*cy).scale(k));
    mapG.selectAll('.cp').classed('pinned', false);
    d3.select(node.el).classed('pinned', true);
    pinned = node.d;
    var r = node.el.getBoundingClientRect();
    setTimeout(function(){
      showTip({clientX: box.left + W/2, clientY: box.top + H/2}, node.d);
    }, 720);
  }
})();
</script>
</body>
</html>
