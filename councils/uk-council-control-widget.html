<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UK Council Control</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<style>
  :root{
    /* the Nowcast palette: grey page, cream panels */
    --bg:#E2E4E4; --panel:#fbf7f4; --ink:#15171a; --muted:#6b7280; --faint:#9ca3af;
    --line:#e3e3df; --line2:#eeeeea; --accent:#004d4d; --radius:10px;
    --cardhd:#002626;
  }
  html, body{background:var(--bg);}
  #cc-app *{box-sizing:border-box;}
  #cc-app{font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased;
    color:var(--ink); background:transparent; max-width:1120px; margin:0 auto; padding:8px 4px 40px;
    line-height:1.3;}
  #cc-app p, #cc-app div, #cc-app span, #cc-app h1, #cc-app h2, #cc-app h3{line-height:inherit;}

  .masthead{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:14px;}
  .masthead h1{font-size:1.55rem; font-weight:900; letter-spacing:-0.03em; margin:0; line-height:1.15;}
  .modepill{font-size:.7rem; font-weight:800; text-transform:uppercase; letter-spacing:.06em;
    padding:6px 11px; border-radius:7px; background:#eef2f2; color:var(--accent); white-space:nowrap;
    line-height:1.2;}

  .section-h{font-size:.72rem; text-transform:uppercase; letter-spacing:.09em; color:var(--faint);
    font-weight:700; margin:26px 0 12px; line-height:1.2;}
  .panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:20px;}
  @media(max-width:640px){ .panel{padding:15px;} }

  /* summary tiles */
  .totstrip{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:8px;}
  @media(max-width:1000px){ .totstrip{grid-template-columns:repeat(4,minmax(0,1fr));} }
  @media(max-width:820px){ .totstrip{grid-template-columns:repeat(3,minmax(0,1fr));} }
  @media(max-width:460px){ .totstrip{grid-template-columns:repeat(2,minmax(0,1fr));} }
  .tot{border-radius:8px; padding:11px 12px; cursor:pointer; border:2px solid transparent; transition:transform .12s;}
  .tot:hover{transform:translateY(-2px);}
  .tot.on{border-color:#15171a;}
  .tot .nm{font-size:.7rem; font-weight:800; text-transform:uppercase; opacity:.92; margin-bottom:1px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.2;}
  .tot .n{font-size:1.7rem; font-weight:900; line-height:1; font-variant-numeric:tabular-nums;}
  .tot .sub{font-size:.68rem; font-weight:700; opacity:.85; margin-top:3px;
    font-variant-numeric:tabular-nums; line-height:1.2;}

  /* national seat bar */
  .seatbar{height:34px; border-radius:7px; overflow:hidden; display:flex; margin:14px 0 8px; background:var(--line2);}
  .seatbar .seg{height:100%;}
  .barkey{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:.74rem; color:var(--muted);
    font-weight:600; line-height:1.3;}
  .barkey i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px;}

  /* controls */
  .toolbar{display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; align-items:center;}
  .toolbar.maptools{margin-bottom:20px;}
  /* on a narrow screen the search gets a line of its own under the buttons */
  @media(max-width:700px){
    .toolbar .spacer{display:none;}
    .toolbar .search{flex:1 0 100%;}
    .toolbar .search input{width:100%;}
    .toolbar .sugg{width:100%; max-width:none;}
    /* tier toggle takes a line to itself so the colour buttons start the next */
    .toolbar .tiergroup{flex:1 0 100%; margin-right:0;}
  }
  .mmb{padding:7px 13px; border-radius:7px; border:1px solid var(--line); background:#fff; font-weight:700;
    font-size:.78rem; color:var(--muted); cursor:pointer; font-family:inherit; line-height:1.2;}
  .mmb:hover{border-color:var(--accent); color:var(--accent);}
  .mmb.active{background:var(--accent); color:#fff; border-color:var(--accent);}
  .spacer{flex:1;}
  .search{position:relative;}
  .search input{border:1px solid var(--line); border-radius:8px; padding:7px 12px; font-family:inherit;
    font-size:.8rem; font-weight:600; line-height:1.2; width:190px; color:var(--ink); background:#fff;}
  .search input::placeholder{color:var(--faint); font-weight:500;}
  .search input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(0,77,77,.08);}
  .sugg{position:absolute; z-index:70; top:calc(100% + 4px); right:0; left:auto;
    width:280px; max-width:78vw; background:#fff;
    border:1px solid var(--line); border-radius:8px; box-shadow:0 10px 26px rgba(0,0,0,.13);
    overflow:hidden; display:none;}
  .sugg div{padding:7px 11px; font-size:.8rem; cursor:pointer; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;}
  .sugg div:hover, .sugg div.sel{background:#eef2f2; color:var(--accent);}

  /* the two tiers sit side by side and share one zoom; captions, maps and the
     side panel are all placed on one grid so their tops line up */
  .mapgrid{display:grid; gap:6px 12px; align-items:start;
    grid-template-columns:minmax(0,1fr) minmax(0,1fr) 300px;
    grid-template-areas:"m1 m2 panel" "leg leg leg";}
  @media(max-width:900px){
    .mapgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);
      grid-template-areas:"m1 m2" "leg leg";}
  }
  @media(max-width:640px){
    .mapgrid{grid-template-columns:minmax(0,1fr);
      grid-template-areas:"m1" "m2" "leg";}
  }
  /* one tier at a time: the shown map spans both map columns */
  .mapgrid.only-lower{grid-template-areas:"m1 m1 panel" "leg leg leg";}
  .mapgrid.only-lower .m2{display:none;}
  .mapgrid.only-upper{grid-template-areas:"m2 m2 panel" "leg leg leg";}
  .mapgrid.only-upper .m1{display:none;}
  @media(max-width:900px){
    .mapgrid.only-lower{grid-template-areas:"m1 m1" "mc mc" "leg leg";}
    .mapgrid.only-upper{grid-template-areas:"m2 m2" "mc mc" "leg leg";}
  }
  @media(max-width:640px){
    .mapgrid.only-lower{grid-template-areas:"m1" "mc" "leg";}
    .mapgrid.only-upper{grid-template-areas:"m2" "mc" "leg";}
  }
  /* phones and tablets: the council's summary under the map in the ward view
     (a ward's own card still floats over the map when it is tapped) */
  #mcard{display:none; grid-area:mc; background:var(--panel); border:1px solid var(--line);
    border-radius:var(--radius); overflow:hidden; margin-top:4px;}
  @media(max-width:900px){ #mcard.on{display:block;} }
  /* with one tier on screen there is room to draw it bigger */
  @media(min-width:901px){
    .mapgrid.only-lower .mapbox, .mapgrid.only-upper .mapbox{
      height:700px; max-width:none; margin:0;}
  }
  .tiergroup{display:flex; gap:8px; margin-right:10px;}
  /* tier toggle: one switch with a label either side, the same height as the buttons */
  .tierswitch{display:inline-flex; align-items:center; gap:2px; height:31px; padding:0 4px;
    border:1px solid var(--line); border-radius:7px; background:#fff;}
  .tierswitch .tsl{border:0; background:none; padding:0 7px; height:100%; font-family:inherit;
    font-size:.78rem; font-weight:700; color:var(--faint); cursor:pointer; line-height:1.2;}
  .tierswitch .tsl:hover{color:var(--accent);}
  .tierswitch .tsl.active{color:var(--ink);}
  .tierswitch .tst{position:relative; width:36px; height:20px; flex:none; border:0; padding:0;
    border-radius:99px; background:var(--accent); cursor:pointer;}
  .tierswitch .tst i{position:absolute; top:3px; left:3px; width:14px; height:14px; border-radius:50%;
    background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:transform .18s ease;}
  .tierswitch .tst.up i{transform:translateX(16px);}
  .tierswitch .tst:focus-visible, .tierswitch .tsl:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  /* Reset is a secondary action, so it sits back from the toggles */
  .mmb.ghost{color:var(--faint); border-color:var(--line2); background:#fbfbfa; font-weight:600;}
  .mmb.ghost:hover{color:var(--accent); border-color:var(--line); background:#fff;}
  .m1{grid-area:m1;} .m2{grid-area:m2;}
  .mapbox{position:relative; width:100%; height:600px; background:var(--panel);
    border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}
  @media(max-width:900px){ .mapbox{height:570px;} }
  @media(max-width:640px){ .mapbox{height:500px;} }

  /* side panel - the same card the tooltip renders, pinned in place */
  #detail{grid-area:panel; background:var(--panel); border:1px solid var(--line);
    border-radius:var(--radius); overflow:hidden; align-self:start;}
  @media(max-width:900px){ #detail, .mapgrid #detail.hase, .mapgrid #detail.hasw{display:none;} }
  #detail .empty{padding:20px;}
  #detail .empty h3{margin:0 0 4px; font-size:.95rem; font-weight:800;}
  #detail .empty p{margin:0 0 16px; font-size:.8rem; color:var(--muted); line-height:1.5;}
  #detail .ctrlrow{display:grid; grid-template-columns:1fr 34px; align-items:center; gap:8px;
    font-size:.78rem; font-weight:700; padding:5px 0; border-top:1px solid var(--line2); line-height:1.2;}
  #detail .ctrlrow i{display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:7px; vertical-align:-1px;}
  #detail .ctrlrow b{text-align:right; font-variant-numeric:tabular-nums;}
  .mapbox svg{cursor:grab; display:block;} .mapbox svg:active{cursor:grabbing;}
  .cp{stroke:#fff; stroke-width:.6px; cursor:pointer; transition:fill-opacity .15s;
    vector-effect:non-scaling-stroke;}
  .cp:hover{stroke:#15171a; stroke-width:1.6px;}
  .cp.pinned{stroke:#15171a; stroke-width:2px;}
  .cp.dim{fill-opacity:.16;}
  /* ward view: the chosen council's wards on top, every other council faded */
  .cp.bg{fill-opacity:.13;}
  .cp.bg:hover{fill-opacity:.34;}   /* a neighbour you can click through to */
  .cp.inward{display:none;}
  .wd{stroke:#fff; stroke-width:1.4px; cursor:pointer; vector-effect:non-scaling-stroke;
    transition:fill-opacity .15s;}
  .wd:hover{stroke:#15171a; stroke-width:2.6px;}
  .wd.dim{fill-opacity:.16;}
  .wd.pinned, .wd.hl{stroke:#15171a; stroke-width:2.6px;}
  /* ward view: only the selected council gets the thick cream outline (.wbound);
     the councils around it keep the map's thin boundaries */
  .wbound{fill:none; stroke:var(--panel); stroke-width:3.15px; vector-effect:non-scaling-stroke;
    pointer-events:none;}
  /* side panel in the ward view: three boxes - the council's own card (it
     stays put) and every ward below it, together exactly as tall as the map
     (set from the map in fitPanel). A ward's councillors float over the map. */
  #detail.hasw{display:flex; flex-direction:column; gap:10px; height:700px; position:relative; top:0;
    background:none; border:0; border-radius:0; overflow:visible;}
  #detail.hasw .pbox{background:var(--panel); border:1px solid var(--line);
    border-radius:var(--radius); overflow:hidden;}
  #detail.hasw #dcouncil{flex:0 1 auto; min-height:0; overflow-y:auto;}
  /* the idle panel: the next round of elections, as tall as the map */
  #detail.hase{display:flex; flex-direction:column; height:700px;}
  .elec-hd{padding:16px 16px 10px; flex:none;}
  .elec-hd h3{margin:0 0 3px; font-size:1rem; font-weight:800; color:var(--ink);}
  .elec-hd p{margin:0; font-size:.76rem; color:var(--muted); line-height:1.45;}
  .elec-hd p b{color:var(--ink);}
  .elec-lbl{font-size:.64rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase;
    color:var(--faint); margin:12px 0 6px;}
  .elec-bar{display:flex; height:10px; border-radius:3px; overflow:hidden;}
  .elec-bar i{display:block; height:100%;}
  .elec-grid{display:grid; grid-template-columns:1fr 1fr; gap:0 16px; margin-top:8px;}
  .elec-grid div{display:flex; justify-content:space-between; align-items:center; font-size:.76rem;
    font-weight:700; padding:3px 0; border-top:1px solid var(--line2);}
  .elec-grid i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px;}
  .elec-grid b{font-variant-numeric:tabular-nums;}
  .elist{flex:1 1 0; min-height:120px; overflow-y:scroll; border-top:1px solid var(--line);
    overscroll-behavior:contain; scrollbar-width:thin; scrollbar-color:#b9c3c1 transparent;}
  .elist::-webkit-scrollbar{width:8px;}
  .elist::-webkit-scrollbar-thumb{background:#b9c3c1; border-radius:8px; border:2px solid var(--panel);}
  .elist::-webkit-scrollbar-thumb:hover{background:var(--accent);}
  .elist .elh{position:sticky; top:0; z-index:1; background:#fbfbfa; padding:7px 16px 6px;
    font-size:.64rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--faint);
    border-bottom:1px solid var(--line2);}
  .elist .el{display:grid; grid-template-columns:minmax(0,1fr) auto auto; align-items:center; gap:8px;
    padding:6px 16px; border-bottom:1px solid var(--line2); cursor:pointer;}
  .elist .el:hover{background:#f4f7f6;}
  .elist .en{font-size:.76rem; font-weight:700; color:var(--ink); min-width:0;}
  .elist .es{font-size:.68rem; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap;}
  .elist .ec{font-size:9px; font-weight:800; padding:3px 5px; border-radius:4px; white-space:nowrap;}
  .cp.lhl{stroke:#15171a; stroke-width:2px;}
  .cp.out{pointer-events:none; cursor:default;}
  /* projection mode: every projected ward on the national map */
  .pw{stroke:#fff; stroke-width:.3px; vector-effect:non-scaling-stroke; cursor:pointer;}
  .pw:hover{stroke:#15171a; stroke-width:1.4px;}
  .pvb path{fill:none; stroke:#fff; stroke-width:1.1px; vector-effect:non-scaling-stroke; pointer-events:none;}
  /* elections view: the area of a new mayoralty being elected */
  .mayor{fill:none; stroke:#15171a; stroke-width:2px; stroke-dasharray:6 3; stroke-linecap:butt;
    stroke-linejoin:round; vector-effect:non-scaling-stroke; pointer-events:none;}
  /* elections view: battlegrounds and the table filters */
  .bgrid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:12px;}
  @media(max-width:760px){ .bgrid{grid-template-columns:minmax(0,1fr);} }
  .bgcol{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}
  .bgcol h4{margin:0; padding:14px 16px 3px; font-size:.92rem; font-weight:800; color:var(--ink);}
  .bgcol p{margin:0; padding:0 16px 11px; font-size:.72rem; color:var(--muted); line-height:1.45;}
  .bglist{max-height:390px; overflow-y:auto; border-top:1px solid var(--line); overscroll-behavior:contain;
    scrollbar-width:thin; scrollbar-color:#b9c3c1 transparent;}
  .bglist::-webkit-scrollbar{width:8px;}
  .bglist::-webkit-scrollbar-thumb{background:#b9c3c1; border-radius:8px; border:2px solid var(--panel);}
  .bgrow{display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:10px; align-items:center;
    padding:7px 16px; border-bottom:1px solid var(--line2); cursor:pointer;}
  .bgrow:hover{background:#f4f7f6;}
  .bgrow .bn{font-size:.78rem; font-weight:700; color:var(--ink); min-width:0;}
  .bgrow .bd{font-size:.7rem; color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums;}
  .bgrow .bc{font-size:9px; font-weight:800; padding:3px 5px; border-radius:4px; white-space:nowrap;}
  .bgcol .none{padding:14px 16px; font-size:.76rem; color:var(--muted);}
  .bgnote{font-size:.72rem; color:var(--muted); margin:8px 2px 0; line-height:1.45;}
  /* majority meters */
  .mm{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px 12px;}
  .mm-hd{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:10px;}
  .mm-hd select{font:inherit; font-size:.8rem; font-weight:800; height:32px; padding:0 8px;
    border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); cursor:pointer;}
  .mm-note{flex:1 1 260px; font-size:.72rem; color:var(--muted); line-height:1.45; margin-left:6px;}
  .mm-key{display:flex; flex-wrap:wrap; gap:6px 16px; font-size:.72rem; color:var(--muted); margin:0 0 8px;}
  .mm-key i{display:inline-block; width:12px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px;}
  .mm-list{border-top:1px solid var(--line2);}
  .mm-row{display:grid; grid-template-columns:minmax(0,210px) minmax(0,1fr) 210px; gap:12px; align-items:center;
    padding:6px 4px; border-bottom:1px solid var(--line2); cursor:pointer;}
  .mm-row:hover{background:#f4f7f6;}
  .mm-name{font-size:.78rem; font-weight:700; color:var(--ink); display:flex; align-items:center; gap:6px; min-width:0;}
  .mm-ctrl{font-size:9px; font-weight:800; padding:2px 5px; border-radius:4px; white-space:nowrap; flex:none;}
  .mm-bar{position:relative; display:flex; height:16px; border-radius:3px; overflow:visible; background:#f1f1ee;}
  .mm-bar i{display:block; height:100%; flex:none;}
  .mm-bar i:first-child{border-radius:3px 0 0 3px;}
  .mm-bar em{position:absolute; top:-4px; bottom:-4px; width:2px; margin-left:-1px; background:#15171a;}
  .mm-txt{font-size:.72rem; color:var(--muted); line-height:1.3;}
  .mm-txt b{color:var(--ink);}
  .mm-txt small{display:block; font-size:.66rem; color:var(--faint);}
  .mm-row.st-safe .mm-txt{color:var(--ink);}
  .mm-foot{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:10px;
    font-size:.72rem; color:var(--muted);}
  @media(max-width:640px){
    .mm-row{grid-template-columns:minmax(0,1fr); gap:5px;}
    .mm-txt small{display:inline; margin-left:6px;}
  }
  .efilt{display:inline-flex; gap:6px; flex-wrap:wrap; align-items:center;}
  .efilt select{font:inherit; font-size:.76rem; font-weight:700; height:31px; padding:0 8px;
    border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); cursor:pointer;}
  .lgd.lgdx{cursor:default;}
  .lgd.lgdx i{border:1px solid var(--line);}
  /* a neighbouring council hovered in the ward view: just its header */
  .nbr > :not(.hd):not(.stack):not(.hint){display:none !important;}
  .nbr .hint{display:block; padding:9px 12px; font-size:.72rem; color:var(--muted); text-align:center;}
  .wlist{flex:1 1 0; min-height:150px; overflow-y:auto; background:var(--panel);}
  /* the box rule above clips (overflow:hidden) and outranks .wlist, which
     left the list unscrollable by wheel or touch - scroll it explicitly, with
     a visible bar so it reads as a list that goes on */
  #detail.hasw #wlist{overflow-y:scroll; overscroll-behavior:contain;
    scrollbar-width:thin; scrollbar-color:#b9c3c1 transparent;}
  #wlist::-webkit-scrollbar{width:8px;}
  #wlist::-webkit-scrollbar-track{background:transparent;}
  #wlist::-webkit-scrollbar-thumb{background:#b9c3c1; border-radius:8px;
    border:2px solid var(--panel);}
  #wlist::-webkit-scrollbar-thumb:hover{background:var(--accent);}
  .wlist .wlh{position:sticky; top:0; z-index:1; background:#fbfbfa; padding:8px 12px 7px;
    font-size:.64rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
    color:var(--faint); border-bottom:1px solid var(--line2); line-height:1.2;}
  .wlist .wl{display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:6px 12px; border-bottom:1px solid var(--line2); cursor:pointer; line-height:1.2;}
  .wlist .wl:hover, .wlist .wl.hov{background:#f4f7f6;}
  .wlist .wl.on{background:#e8f0ef; box-shadow:inset 3px 0 0 var(--accent);}
  .wlist .wl.dim{opacity:.35;}
  .wlist .wn{font-size:.76rem; font-weight:700; color:var(--ink); min-width:0;}
  .wlist .wc{display:flex; gap:3px; flex:none;}
  .wlist .wc i{font-style:normal; font-size:9px; font-weight:800; line-height:1;
    padding:3px 4px; border-radius:3px;}
  .wlist .wc .none{color:var(--faint); font-size:.68rem; font-weight:600; padding:0;}
  .wardbar{position:absolute; left:10px; top:10px; right:10px; display:flex; align-items:center;
    gap:8px; pointer-events:none; z-index:5; line-height:1.2;}
  .wardbar .wback{pointer-events:auto; padding:6px 11px; border-radius:7px; border:1px solid var(--accent);
    background:var(--accent); color:#fff; font-weight:700; font-size:.74rem; cursor:pointer;
    font-family:inherit; white-space:nowrap; line-height:1.2;}
  .wardbar .wback:hover{background:#003a3a;}
  .wardbar .wt{pointer-events:auto; min-width:0; background:rgba(255,255,255,.93); border:1px solid var(--line);
    border-radius:7px; padding:6px 10px; font-size:.74rem; font-weight:800; color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .wardbar .wt span{color:var(--muted); font-weight:600;}
  /* councils that elect by thirds or halves: show only the seats up next */
  .wardbar .wup{pointer-events:auto; margin-left:auto; padding:6px 10px; border-radius:7px;
    border:1px solid var(--line); background:rgba(255,255,255,.93); font-family:inherit;
    font-size:.74rem; font-weight:700; color:var(--muted); cursor:pointer; white-space:nowrap; line-height:1.2;}
  .wardbar .wup:hover{color:var(--accent); border-color:var(--accent);}
  .wardbar .wup.on{background:var(--accent); border-color:var(--accent); color:#fff;}
  .cr.notup{opacity:.35;}
  .map-hint{position:absolute; left:14px; bottom:12px; font-size:.72rem; color:var(--faint);

  .map-reset{position:absolute; right:12px; top:12px; padding:5px 11px; border-radius:7px;

  .map-reset:hover{border-color:var(--accent); color:var(--accent);}
  .loading{padding:80px 20px; text-align:center; color:var(--muted); font-weight:600;}

  /* legend */
  .legend{grid-area:leg; display:flex; flex-wrap:wrap; gap:7px; margin-top:6px; align-content:start;}
  .lgd{display:flex; align-items:center; gap:6px; font-size:.74rem; font-weight:700; color:var(--muted);

    line-height:1.2;}
  .lgd:hover{border-color:var(--accent); color:var(--accent);}

  .lgd i{width:13px; height:13px; border-radius:3px; flex:none;}
  .lgd b{color:var(--ink); font-variant-numeric:tabular-nums;}

  /* card - used by both the floating tooltip and the side panel */
  #cc-tip{position:fixed; pointer-events:none; z-index:60; width:252px; line-height:1.3;
    max-width:calc(100vw - 16px); display:none; border-radius:12px;

    font-family:'Inter',system-ui,sans-serif;}
  .ccard .hd{background:var(--cardhd); color:#fff; padding:11px 12px 10px;}

    margin:0;}
  .ccard .hd .ty{font-size:.68rem; opacity:.8; font-weight:600; margin-top:1px; line-height:1.25;}
  .ccard .hd .res{display:flex; gap:4px; margin:9px 0 7px; min-height:26px;}
  .ccard .hd .pill{flex:1; border-radius:6px; display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:.8rem; padding:4px 6px; text-align:center; line-height:1.15;}
  .ccard .hd .meta{font-size:.71rem; opacity:.92; line-height:1.45;}
  .ccard .hd .meta b{font-weight:800;}
  .ccard .stack{display:flex; height:9px; background:var(--cardhd);}
  .ccard .stack i{height:100%;}
  .ccard .bd{padding:9px 12px 6px;}
  #cc-tip .bd{max-height:236px; overflow:hidden;}
  .ccard{--barh:18px; line-height:1.3;}
  .ccard .r{display:grid; grid-template-columns:34px 1fr 30px; align-items:stretch;
    gap:6px; margin-bottom:4px; min-height:var(--barh);}
  .ccard .r .ab{height:var(--barh); display:flex; align-items:center; justify-content:center;
    padding:0; line-height:1; font-size:10px; font-weight:800; border-radius:4px;}
  /* overflow stays visible so the majority rule can bleed between rows */
  .ccard .r .bar{position:relative; height:var(--barh); align-self:center;
    background:#eee; border-radius:4px;}
  .ccard .r .bar .fill{position:absolute; left:0; top:0; height:100%; display:flex;
    border-radius:4px; overflow:hidden;}
  .ccard .r .bar .fill i{height:100%; flex:none; display:flex; align-items:center;
    justify-content:center; font-size:10px; line-height:1; font-weight:800; font-style:normal;
    font-variant-numeric:tabular-nums; overflow:hidden;}
  .ccard .r .bar .maj{position:absolute; top:-3px; bottom:-3px; width:2px;
    background:#15171a; z-index:4; pointer-events:none;}
  .ccard .cyckey{display:flex; flex-wrap:wrap; gap:3px 10px; padding:2px 12px 9px;
    font-size:.62rem; font-weight:700; color:var(--muted); line-height:1.2;}
  .ccard .cyckey span{display:flex; align-items:center; gap:4px;}
  .ccard .cyckey i{width:9px; height:9px; border-radius:2px; flex:none;}
  .ccard .r .n{height:var(--barh); display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums;}
  /* 2027 projection block on the council card (elections page) */
  .ccard .pj{padding:9px 12px 8px; border-top:1px solid var(--line2);}
  .ccard .pj .pjl{font-size:.62rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase;
    color:var(--faint); margin-bottom:6px;}
  .ccard .pj .pjp{display:inline-block; border-radius:6px; padding:5px 9px; font-weight:800; font-size:.78rem;}
  .ccard .pj .pjm{font-size:.71rem; color:var(--muted); line-height:1.45; margin-top:5px;}
  .ccard .pj .pjm b{color:var(--ink); font-weight:800;}
  /* projection-mode card: likely range on each bar, chance of each outcome */
  .ccard .r .bar .rg{position:absolute; top:50%; margin-top:-1px; height:2px; background:#15171a; opacity:.6;
    z-index:3; pointer-events:none; box-sizing:border-box;}
  .ccard .r .bar .rg::before,.ccard .r .bar .rg::after{content:''; position:absolute; top:-4px; width:2px; height:10px; background:#15171a;}
  .ccard .r .bar .rg::before{left:0;} .ccard .r .bar .rg::after{right:0;}
  .ccard .r .bar .fill i .sn{position:relative; z-index:5; padding:2px 3px; line-height:1;}
  .ccard .bd.pjr .r{grid-template-columns:34px 1fr 64px;}
  .ccard .bd.pjr .r .n{justify-content:center; gap:4px;}
  .ccard .r .n .nb,.ccard .r .n .dl{width:30px; height:var(--barh); display:flex; align-items:center; justify-content:center;
    border-radius:4px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; flex:none;}
  .ccard .r .n .nb{background:#eee; color:var(--ink); font-size:12px;}
  .ccard .r .n .dl{font-size:10px; background:#f1f1ee; color:var(--faint);}
  .ccard .r .n .dl.up{background:#16a34a; color:#fff;} .ccard .r .n .dl.dn{background:#dc2626; color:#fff;}
  .ccard .pch{padding:9px 12px 10px; border-top:1px solid var(--line2);}
  .ccard .pj .ss{position:relative; margin-top:2px;}
  .ccard .pj .ss .sb{display:flex; height:18px; border-radius:4px; overflow:hidden; background:#eee;}
  .ccard .pj .ss .sb i{display:flex; align-items:center; justify-content:center; font-size:.64rem; font-weight:800; font-style:normal;
    border-right:1px solid #fff; overflow:hidden; flex:none;}
  .ccard .pj .ss .sm{position:absolute; top:-3px; bottom:-3px; width:2px; margin-left:-1px; background:#15171a;}
  .ccard .pj .ck,.ccard .pch0 .ck{display:flex; flex-wrap:wrap; gap:3px 10px; margin-top:6px; font-size:.68rem; color:var(--muted);}
  .ccard .pj .ck span{display:flex; align-items:center; gap:4px;}
  .ccard .pj .ck i{width:9px; height:9px; border-radius:2px; flex:none;}
  .ccard .pj .ck b{color:var(--ink); font-weight:800;}
  .ccard .pch0 .cb{display:flex; height:20px; border-radius:4px; overflow:hidden;}
  .ccard .pch0 .cb i{display:flex; align-items:center; justify-content:center; font-size:.64rem; font-weight:800; font-style:normal;
    border-right:1px solid #fff; white-space:nowrap; overflow:hidden; flex:none;}
  .ccard .pch0 .cb i:last-child{border-right:0;}
  .ccard .pch .pjl{font-size:.62rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); margin-bottom:6px;}
  .ccard .pch .cb{display:flex; height:20px; border-radius:4px; overflow:hidden;}
  .ccard .pch .cb i{display:flex; align-items:center; justify-content:center; font-size:.64rem; font-weight:800; font-style:normal;
    border-right:1px solid #fff; white-space:nowrap; overflow:hidden; flex:none;}
  .ccard .pch .cb i:last-child{border-right:0;}
  .ccard .pch .ck{display:flex; flex-wrap:wrap; gap:3px 10px; margin-top:6px; font-size:.68rem; color:var(--muted);}
  .ccard .pch .ck span{display:flex; align-items:center; gap:4px;}
  .ccard .pch .ck i{width:9px; height:9px; border-radius:2px; flex:none;}
  .ccard .pch .ck b{color:var(--ink); font-weight:800;}
  /* battleground snake (elections page, needs the projection file) */
  .snbar{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;}
  .snsum{font-size:.78rem; color:var(--muted); margin:0 0 12px; line-height:1.5;}
  .snsum b{color:var(--ink);}
  #snake svg{display:block; width:100%; height:auto;}
  #snake .sb{cursor:pointer;}
  #snake .sb:hover .bk{stroke:#15171a; stroke-width:2;}
  #snake text{font-family:inherit; pointer-events:none;}
  .snkey{display:flex; flex-wrap:wrap; gap:7px; margin-top:12px;}
  .snnote{font-size:.72rem; color:var(--faint); margin-top:10px; line-height:1.5;}
  .pvbar{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:0 0 12px;}
  .pvbar .pvl{font-size:.68rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--faint);}
  .pvbar .pvn{font-size:.72rem; color:var(--faint); font-weight:600;}
  .ccard .ft{text-align:center; padding:6px; color:var(--accent); font-weight:800; font-size:.7rem;
    border-top:1px solid var(--line2); line-height:1.2;}
  /* ward card - one row per councillor */
  .ccard .cr{display:grid; grid-template-columns:34px 1fr auto; gap:8px; align-items:center;
    margin-bottom:5px; min-height:var(--barh);}
  .ccard .cr .ab{height:var(--barh); display:flex; align-items:center; justify-content:center;
    line-height:1; font-size:10px; font-weight:800; border-radius:4px;}
  .ccard .cr .who{font-size:.8rem; font-weight:700; line-height:1.2; min-width:0; color:var(--ink);}
  .ccard .cr .who small{display:block; font-size:.66rem; color:var(--muted); font-weight:600; line-height:1.25;}
  .ccard .cr .yr{font-size:.7rem; font-weight:800; color:var(--muted); font-variant-numeric:tabular-nums;}
  .ccard .none{font-size:.78rem; color:var(--muted); padding:2px 0 8px; line-height:1.4;}

  /* table */
  .table-wrap{display:none; border:1px solid var(--line); border-radius:var(--radius); overflow:auto; max-height:560px;
    background:var(--panel);}
  #cc-app table{width:100%; border-collapse:collapse; font-size:.8rem;}
  #cc-app th, #cc-app td{padding:8px 10px; text-align:left; border-bottom:1px solid var(--line2);
    white-space:nowrap; line-height:1.25;}
  #cc-app th{position:sticky; top:0; background:#fbfbfa; font-size:.65rem; text-transform:uppercase;
    letter-spacing:.05em; color:var(--faint); font-weight:700; cursor:pointer; z-index:2;
    border-bottom:2px solid var(--line);}
  #cc-app td{color:var(--muted); font-variant-numeric:tabular-nums;}
  /* council name stays put while the party columns scroll under it */
  #cc-app td:first-child{position:sticky; left:0; z-index:1; background:var(--panel);
    color:var(--ink); font-weight:600;}
  #cc-app th:first-child{left:0; z-index:3;}
  #cc-app th:hover{color:var(--accent);}
  #cc-app td.ctrl{color:#fff; font-weight:800; text-align:center; border-radius:0;}
  #cc-app td.num{text-align:right; font-variant-numeric:tabular-nums; color:var(--muted);}
  #cc-app tbody tr:hover td{background:#faf9f6;}

  .foot{margin-top:22px; font-size:.74rem; color:var(--faint); line-height:1.55;}
  .foot p{margin:0 0 10px;}
  .foot p:last-child{margin-bottom:0;}
  .foot a{color:var(--accent); font-weight:700; text-decoration:none;}
  .foot a:hover{text-decoration:underline;}
</style>

<body>
<div id="cc-app">
  <div class="masthead">
    <h1 id="title">Who runs Britain's councils</h1>
    <span class="modepill" id="stamp">Loading…</span>
  </div>

  <div id="loading" class="loading">Loading council data…</div>

  <div id="app" style="display:none;">
    <div class="pvbar" id="pvbar" style="display:none;">
      <span class="pvl">Show</span>
      <button type="button" class="mmb active" data-pv="0">Now</button>
      <button type="button" class="mmb" data-pv="1">2027 projection</button>
      <span class="pvn" id="pvnote"></span>
    </div>
    <div class="panel">
      <div class="section-h" style="margin:0 0 12px;" id="h-tiles">Councils run</div>
      <div class="totstrip" id="tiles"></div>
      <div class="section-h" style="margin:22px 0 0;" id="h-nat">Councillors across the UK</div>
      <div class="seatbar" id="natbar"></div>
      <div class="barkey" id="natkey"></div>
    </div>

    <div class="section-h">The map</div>
    <div class="toolbar maptools">
      <span class="tiergroup">
        <span class="tierswitch" id="tierswitch">
          <button type="button" class="tsl active" data-maps="lower" title="Districts, unitaries, metropolitan and London boroughs, Scotland, Wales and Northern Ireland">Lower tier</button>
          <button type="button" class="tst" id="tiertrack" role="switch" aria-checked="false" aria-label="Show the upper tier"><i></i></button>
          <button type="button" class="tsl" data-maps="upper" title="County councils and unitaries">Upper tier</button>
        </span>
      </span>
      <span id="pvmap" style="display:none; gap:8px; align-items:center;">
        <button type="button" class="mmb active" data-pv="0">Now</button>
        <button type="button" class="mmb" data-pv="1">2027 projection</button>
        <span style="width:1px; height:22px; background:var(--line); margin:0 2px;"></span>
      </span>
      <button class="mmb active" data-colour="control">Control</button>
      <button class="mmb" data-colour="largest">Largest party</button>
      <button class="mmb ghost" id="reset">Reset view</button>
      <span class="spacer"></span>
      <div class="search">
        <input id="q" type="text" placeholder="Find a council…" autocomplete="off">
        <div class="sugg" id="sugg"></div>
      </div>
    </div>

    <div class="mapgrid only-lower">
      <div class="mapbox m1" id="map-lower">
      </div>
      <div class="mapbox m2" id="map-upper">
      </div>
      <div id="detail" class="ccard"></div>
      <div id="mcard" class="ccard"></div>
      <div class="legend" id="legend"></div>
    </div>

    <!-- elections view, with the projection file: swing each party needs for a majority -->
    <div id="snwrap" style="display:none;">
      <div class="section-h">Battlegrounds &middot; swing needed for a majority</div>
      <div class="panel">
        <div class="snbar" id="snparty"></div>
        <div class="snsum" id="snsum"></div>
        <div id="snake"></div>
        <div class="snkey" id="snkey"></div>
        <div class="snnote" id="snnote"></div>
      </div>
    </div>

    <!-- elections view only: where control could change -->
    <div id="bgwrap" style="display:none;">
      <div class="section-h">Majority meters</div>
      <div class="bgrid" id="bg"></div>
    </div>

    <div class="toolbar" style="margin-top:26px;">
      <button class="mmb" id="tabletog">Show full table</button>
      <button class="mmb" id="csvbtn">Download CSV</button>
      <span class="efilt" id="efilt" style="display:none;"></span>
      <span class="spacer"></span>
      <span style="font-size:.74rem; color:var(--faint); font-weight:600;" id="counts"></span>
    </div>
    <div class="table-wrap" id="tablewrap"><table id="tbl"></table></div>
    <div class="section-h" id="ni-head" style="display:none;">Northern Ireland</div>
    <div class="table-wrap" id="tablewrap-ni"><table id="tbl-ni"></table></div>

    <div class="foot" id="foot"></div>
  </div>
</div>
<div id="cc-tip" class="ccard"></div>

<script>
(function(){
  // ---------------------------------------------------------------- config --
  // Served from GitHub Pages next to this file; falls back to raw.githubusercontent
  // so the widget also works if it is opened from somewhere else.
  var DATA_BASE = 'data/';
  var DATA_FALLBACK = 'https://raw.githubusercontent.com/electionmapsuk/custom-nowcast/refs/heads/main/councils/data/';

  var $ = function(id){ return document.getElementById(id); };
  var tip = $('cc-tip');

  var DATA = null, GEO = {}, colourMode = 'control', mapMode = 'lower';
  // ?view=elections (or ?view=2027): the same dashboard focused on the next
  // round of local elections - only the councils voting are coloured, and the
  // totals, tables and battlegrounds are about the seats being contested.
  var EV = /[?&]view=(elections|2027)(&|$)/i.test(location.search);
  var OUT_FILL = '#e6e5e1';      // a council not voting, in the elections view
  // In a council that elects by thirds or halves, the ward view can show just
  // the councillors whose seats are up next. On by default in the elections view.
  var UPONLY = EV;
  // 2027 projection (data/projection-2027.json, from the ElectionMapsUK local
  // elections model). Loaded on the elections page only. The Now / 2027
  // projection switch recolours the map, tiles, seat bar, legend and councils
  // list by the projected result; the council card and the table show both.
  // ?view=elections&proj=1 opens on the projection.
  var PROJ = null;
  var PV = /[?&]proj(=1)?(&|$)/i.test(location.search);
  var PROJ_SURE = 0.6;   // projected control at least this likely: solid fill; less likely: paler
  var NOPROJ_FILL = '#cfcdc6';   // voting, but outside the projection (Scotland, Wales)
  function noProj(){ return DATA.councils.filter(function(c){ return inPlay(c) && !projOf(c); }).length; }
  var PROJW = null, PROJW_LOADING = null;
  function loadProjW(){
    if(PROJW || PROJW_LOADING) return PROJW_LOADING;
    PROJW_LOADING = loadJson('projection-wards-2027.json', true).then(function(d){
      PROJW = (d && d.councils) ? d : null;
      if(WARD && WARD.geo) refreshWards();
      drawPVL();
    }).catch(function(){ PROJW_LOADING = null; });
    return PROJW_LOADING;
  }
  // the national ward layer for projection mode: projection-wards-2027.topo.json
  var PVL = null, PVL_LOADING = null;
  function loadPVL(){
    if(PVL || PVL_LOADING || typeof topojson === 'undefined') return PVL_LOADING;
    PVL_LOADING = loadJson('projection-wards-2027.topo.json', true).then(function(t){
      PVL = topojson.feature(t, t.objects.wards).features; drawPVL();
    }).catch(function(){ PVL_LOADING = null; });
    return PVL_LOADING;
  }
  function pvlPeople(g, id){
    var e = PROJW && PROJW.councils[g] && PROJW.councils[g][id], out = [];
    if(!e) return out;
    Object.keys(e.w).forEach(function(p){ for(var i = 0; i < e.w[p]; i++) out.push({p: p}); });
    return out;
  }
  function drawPVL(){
    // the national ward layer is off: the map shows councils, wards only inside an opened council
    eachMap(function(m){ if(m.g) m.g.selectAll('g.pvl,g.pvb').remove(); m.pvlOn = false; });
    if(!window.SHOW_NATIONAL_WARDS) return;
    eachMap(function(m){
      var on = pvOn() && !!PVL && !!PROJW && m.key === 'lower' && m.g;
      if(!on){ if(m.g){ m.g.selectAll('.pvl,.pvb').remove(); } m.pvlOn = false; return; }
      m.g.selectAll('.pvl').style('display', WARD ? 'none' : null);
      m.g.selectAll('.pvb').style('display', WARD ? 'none' : null);
      if(m.pvlOn) return;
      m.pvlOn = true;
      var feats = PVL.filter(function(f){ return projOf(byGss[f.properties.c]); });
      var layer = m.g.insert('g', '.mayor').attr('class', 'pvl').style('display', WARD ? 'none' : null);
      layer.selectAll('path').data(feats).enter().append('path').attr('class', 'pw').attr('d', m.path)
        .attr('fill', function(d){
          var ppl = pvlPeople(d.properties.c, d.properties.id);
          return ppl.length ? wardFill(m, ppl, false, d) : '#ecebe6';
        })
        .on('mousemove', function(e, d){
          if(WARD || pinnedGss) return;
          var c = byGss[d.properties.c], pw = PROJW.councils[d.properties.c] || {}, w = pw[d.properties.id];
          tip.innerHTML = projWardCard(c, {id: d.properties.id, name: w ? w.n : ''}, w, [], null);
          place(e);
        })
        .on('mouseleave', function(){ tip.style.display = 'none'; })
        .on('click', function(e, d){
          tip.style.display = 'none';
          var cc = byGss[d.properties.c];
          if(cc && cc.wards) enterWards(m, d.properties.c); else zoomTo(d.properties.c);
        });
      // council edges over the wards
      var cf = GEO.lower.features.filter(function(f){ return projOf(byGss[f.properties.code]); });
      m.g.insert('g', '.mayor').attr('class', 'pvb').style('display', WARD ? 'none' : null)
        .selectAll('path').data(cf).enter().append('path').attr('d', m.path);
    });
  }
  function projWards(code){ return (pvOn() && PROJW && PROJW.councils[code]) || null; }
  function projOf(c){ return (PROJ && c && c.gss && PROJ.councils[c.gss]) || null; }
  function pvOn(){ return EV && PV && !!PROJ; }
  function projKey(c){ var p = projOf(c); return p ? p.next : 'NOC'; }
  function projSure(p){ return ((p.pc || {})[p.next] || 0) >= PROJ_SURE; }
  function projColour(p){
    if(p.next === 'NOC') return NOC_COLOUR;
    var col = pInfo(p.next).colour;
    return projSure(p) ? col : lighten(col, 0.5);
  }
  function projText(p){ return p.next === 'NOC' ? 'No overall control' : pInfo(p.next).name + ' majority'; }
  function projShort(p){ return (p.next === 'NOC' ? 'NOC' : abbrev(p.next)) + ' ' + Math.round(((p.pc || {})[p.next] || 0) * 100) + '%'; }
  function chanceHtml(p, n){
    return Object.keys(p.pc || {}).sort(function(a, b){ return p.pc[b] - p.pc[a]; })
      .filter(function(k){ return p.pc[k] >= 0.03; }).slice(0, n || 3)

  var KEY_ROLLUP = {RES:1, SF:1, DUP:1, SDLP:1, ALL:1, UUP:1, TUV:1, NIP:1, CIP:1};
  var KEY_MIN = 0.01;   // below this share a party folds into Oth as well
  // The national bar: left to right in this order, and any party with fewer
  // than BAR_MIN seats counted in Oth. Parties not listed sit next to Oth.
  var BAR_ORDER = ['SF', 'YRP', 'GRN', 'PLC', 'SNP', 'SDLP', 'LAB', 'LDM', 'ALL', 'OTH', 'IND',
                   'LOC', 'UUP', 'CON', 'RFM', 'RES', 'DUP', 'TUV'];
  var BAR_MIN = 10;
  // local parties with their own colour on the map, counted with the other
  // localists in the bar and its key

  function buildNatBar(){
    // the elections view shows the seats up

    if(pvOn()){ raw = {}; Object.keys(PROJ.national).forEach(function(p){ raw[p] = PROJ.national[p].won; }); }
    // Parties with fewer than BAR_MIN seats go into Oth, in the bar and its key
    var tot = {}, small = [];
    Object.keys(raw).forEach(function(p){
      if(!raw[p]) return;
      var k = BAR_AS_LOC[p] ? 'LOC'
            : (p !== 'VAC' && p !== 'OTH' && raw[p] < BAR_MIN) ? 'OTH' : p;
      if(k === 'OTH' && k !== p) small.push(p);
      tot[k] = (tot[k] || 0) + raw[p];
    });
    // left to right in BAR_ORDER; anything not in it sits just after Oth
    var known = BAR_ORDER.filter(function(p){ return tot[p]; });
    var extra = Object.keys(tot).filter(function(p){ return p !== 'VAC' && BAR_ORDER.indexOf(p) < 0; })
      .sort(function(x, y){ return tot[y] - tot[x]; });
    var at = known.indexOf('OTH');
    var order = at < 0 ? known.concat(extra) : known.slice(0, at + 1).concat(extra, known.slice(at + 1));
    if(tot.VAC) order.push('VAC');

      return '<div class="seg" title="'+pInfo(p).name+' '+fmt(tot[p])+'" style="width:'+
        (100*tot[p]/sum)+'%; background:'+pInfo(p).colour+'"></div>';
    }).join('');

    // every seat. Vacancies are not a party and stay out of it entirely.

    }).sort(function(a,b){ return tot[b]-tot[a]; });

      return '<span title="'+pInfo(p).name+'"><i style="background:'+pInfo(p).colour+'"></i>'+

      paras.push('The 2027 projection is the ElectionMapsUK local elections model (' + esc(PROJ.meta.version || '') +
