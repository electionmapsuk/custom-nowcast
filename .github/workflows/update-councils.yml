name: Update council control data

on:
  schedule:
    # 06:15 UTC every Monday. Open Council Data UK is usually refreshed over
    # the weekend after Thursday by-elections are declared.
    - cron: "15 6 * * 1"
  workflow_dispatch:
    inputs:
      refresh_boundaries:
        description: "Also re-fetch ONS boundaries (only needed for a new vintage)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: council-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch boundaries (first run or on request)
        if: ${{ inputs.refresh_boundaries || hashFiles('councils/data/boundaries-lower.json') == '' }}
        run: python councils/build/build_boundaries.py --out councils/data

      - name: Build council data
        id: build
        continue-on-error: true
        run: python councils/build/build_councils.py --out councils/data

      - name: Show build report
        if: always()
        run: |
          echo '### Council data build report' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open('councils/data/build-report.json'))
          r['warnings'] = r['warnings'][:25]
          print(json.dumps(r, indent=1)[:8000])
          PY
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Commit changes
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add councils/data
          if git diff --cached --quiet; then
            echo "No change in council data."
          else
            git commit -m "Council data refresh $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Fail the run if the build did not validate
        if: steps.build.outcome != 'success'
        run: |
          echo "Build failed validation - see councils/data/build-report.json" >&2
          exit 1
